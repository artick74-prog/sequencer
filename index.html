    const tabs = document.createElement('div');
    tabs.className = 'track-tabs';
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      const tab = document.createElement('button');
      tab.className = 'track-tab';
      if (t === this.state.activeTrack) tab.classList.add('active');
      tab.style.borderLeftColor = CONFIG.TRACK_COLORS[t];
      const typeLabel = this.state.isDrumTrack(t) ? '♨' : '♫';
      tab.textContent = `${typeLabel} Track ${t + 1}`;
      tab.addEventListener('click', () => {
        if (this.state.activeTrack === t) return;
        this.state.activeTrack = t;
        this.render();
      });
      tabs.appendChild(tab);
    }
    container.appendChild(tabs);

    // ─── Активная дорожка (хедер + сетка) ───
    container.appendChild(this._createTrack(this.state.activeTrack));

    this._initMelodicCells();
    this._initDrumCells();
    this._initPlayheads();
    this._updateAllMelodicNotes();
    this._updateAllDrumNotes();
    this._updateSelection();
    this._updatePasteCursor();
  }

  _renderArrangeView(container) {
    const state = this.state;
    const seq = state.songSequence;
    const wrap = document.createElement('div');
    wrap.className = 'arrange-wrap';

    // ─── Transport for Arrange view ───
    const at = document.createElement('div');
    at.className = 'arrange-transport';
    const aPlay = document.createElement('button');
    aPlay.className = 'btn btn-transport';
    aPlay.id = 'btnPlay';
    aPlay.textContent = state.isPlaying && this.sequencer.isRunning ? '❚❚' : '▶';
    aPlay.classList.toggle('playing', state.isPlaying && this.sequencer.isRunning);
    aPlay.title = 'Play (Space)';
    aPlay.addEventListener('click', () => {
      if (this.sequencer.isRunning) { this.sequencer.stop(); this.updatePlayButton(false); this.updatePlayhead(); }
      else { this.sequencer.start(); this.updatePlayButton(true); }
    });
    at.appendChild(aPlay);
    const aStop = document.createElement('button');
    aStop.className = 'btn btn-transport';
    aStop.id = 'btnStop';
    aStop.textContent = '■';
    aStop.title = 'Stop (Escape)';
    aStop.addEventListener('click', () => { this.sequencer.stop(); this.updatePlayButton(false); this.updatePlayhead(); });
    at.appendChild(aStop);
    // Sync play button with sequencer
    this._arrangePlayBtn = aPlay;
    wrap.appendChild(at);

    // ─── Ruler for Arrange view ───
    const ruler = document.createElement('div');
    const blocksOffset = 61; // lane padding(8) + label(24) + gap(8) + addBtn(18) + gap(3)
    ruler.className = 'arrange-ruler';
    let totalWidth = 0;
    if (seq.length > 0) {
      for (let i = 0; i < seq.length; i++) {
        const ap = state._arrangedPatterns[seq[i]];
        const v = ap ? (ap._activeVariant === 'b' ? ap._variantB : ap._variantA) : null;
        const plen = v ? (v.patternLength || CONFIG.STEPS) : CONFIG.STEPS;
        totalWidth += Math.max(1, plen / 16) * 40;
      }
      ruler.style.width = (totalWidth + blocksOffset) + 'px';
      ruler.style.minWidth = (totalWidth + blocksOffset) + 'px';
      const numBars = Math.ceil(totalWidth / 40);
      for (let b = 0; b <= numBars; b++) {
        const x = b * 40 + blocksOffset;
        if (x > totalWidth + blocksOffset) break;
        const line = document.createElement('div');
        line.className = 'ruler-bar-line';
        line.style.left = x + 'px';
        ruler.appendChild(line);
        if (b < numBars && x < totalWidth + blocksOffset) {
          const label = document.createElement('div');
          label.className = 'ruler-bar-label';
          label.style.left = (x + 4) + 'px';
          label.textContent = b + 1;
          ruler.appendChild(label);
          for (let beat = 1; beat < 4; beat++) {
            const bx = x + beat * 10;
            if (bx <= totalWidth + blocksOffset) {
              const bl = document.createElement('div');
              bl.className = 'ruler-beat-line';
              bl.style.left = bx + 'px';
              ruler.appendChild(bl);
            }
          }
        }
      }
      const aph = document.createElement('div');
      aph.className = 'arrange-playhead';
      aph.style.left = blocksOffset + 'px';
      ruler.appendChild(aph);
      this._arrangePlayheadEl = aph;
      this._rulerOffset = blocksOffset;
    } else {
      ruler.style.display = 'none';
      this._arrangePlayheadEl = null;
      this._rulerOffset = 0;
    }
    wrap.appendChild(ruler);

    // ─── Drag-and-drop state ───
    let _dragSourceSi = -1;
    let _dragInsertIdx = -1;

    const makeAddBtn = (idx) => {
      const btn = document.createElement('button');
      btn.className = 'arrange-add-btn';
      btn.textContent = '+';
      btn.title = 'Add new pattern here';
      btn.addEventListener('click', () => {
        state._saveToArranged(state._editingIdx);
        const empty = StateManager._makeEmptyPattern();
        const newData = {
          _variantA: empty,
          _variantB: StateManager._makeEmptyPattern(),
          _activeVariant: 'a',
          _undoStackA: [], _redoStackA: [],
          _undoStackB: [], _redoStackB: [],
          locatorA: 0,
          locatorB: empty.patternLength,
        };
        state._arrangedPatterns.push(newData);
        const newIdx = state._arrangedPatterns.length - 1;
        state.songSequence.splice(idx, 0, newIdx);
        renderSongArranger();
        this.render();
      });
      return btn;
    };

    const makeBlock = (arrangedIdx, si, variantKey) => {
      const ap = state._arrangedPatterns[arrangedIdx];
      const variant = ap ? (variantKey === 'b' ? ap._variantB : ap._variantA) : null;
      let totalNotes = 0;
      if (variant) {
        for (let t = 0; t < CONFIG.TRACKS; t++) {
          const steps = variant.patternLength || CONFIG.STEPS;
          if (state.trackTypes[t] === 'drum') {
            for (let s = 0; s < steps; s++)
              for (let d = 0; d < CONFIG.DRUM_INSTRUMENTS.length; d++)
                if (variant.drumPattern[t]?.[s]?.[d]) totalNotes++;
          } else {
            for (let s = 0; s < steps; s++)
              if (variant.melodicPattern[t]?.[s] !== null) totalNotes++;
          }
        }
      }
      const bars = variant ? Math.max(1, variant.patternLength / 16) : 1;
      const block = document.createElement('div');
      const isActive = si === state.seqIndex && state.isPlaying;
      block.className = 'arrange-block' + (isActive ? ' active' : '');
      const isEditing = state._editingIdx === arrangedIdx && state._activeVariant === variantKey;
      if (isEditing) block.classList.add('editing');
      block.style.width = (bars * 40) + 'px';
      if (totalNotes > 0) {
        const alpha = 0.15 + Math.min(totalNotes / 64, 1) * 0.55;
        block.style.background = `rgba(158, 212, 230, ${alpha})`;
      }
      const nameStr = ap && ap.name ? ap.name : '';
      const label = variantKey.toUpperCase();
      block.innerHTML = nameStr ? `<span class="block-name">${nameStr.replace(/</g,'&lt;')}</span> <span class="block-label">${label}</span>` : `<span class="block-label">${label}</span>`;
      block.addEventListener('click', () => {
        state._saveToArranged(state._editingIdx);
        state._editingIdx = arrangedIdx;
        state._loadFromArranged(arrangedIdx);
        if (state._activeVariant !== variantKey) state.toggleVariant();
        state.viewMode = 'edit';
        this.render();
        document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === 'edit'));
      });
      block.addEventListener('contextmenu', (e) => {
        showPatternCtxMenu(e, arrangedIdx);
      });
      // ─── Drag-and-drop ───
      block.draggable = true;
      block.dataset.si = si;
      block.addEventListener('dragstart', (e) => {
        _dragSourceSi = si;
        _dragInsertIdx = -1;
        e.dataTransfer.effectAllowed = 'move';
        document.querySelectorAll('.arrange-block.dragging').forEach(el => el.classList.remove('dragging'));
        block.classList.add('dragging');
      });
      block.addEventListener('dragend', () => {
        document.querySelectorAll('.arrange-block.dragging').forEach(el => el.classList.remove('dragging'));
        document.querySelectorAll('.arrange-blocks .drag-placeholder').forEach(el => el.remove());
        _dragSourceSi = -1;
        _dragInsertIdx = -1;
      });
      return block;
    };

    // ─── Placeholder helper ───
    const showPlaceholder = (blocksContainer, insertIdx) => {
      const ph = document.createElement('div');
      ph.className = 'drag-placeholder';
      if (insertIdx >= seq.length) {
        const lastBlock = blocksContainer.querySelector('.arrange-block:last-child');
        if (lastBlock && lastBlock.nextElementSibling) {
          blocksContainer.insertBefore(ph, lastBlock.nextElementSibling);
        } else {
          blocksContainer.appendChild(ph);
        }
      } else {
        const target = blocksContainer.querySelector(`.arrange-block[data-si="${insertIdx}"]`);
        if (target) blocksContainer.insertBefore(ph, target);
      }
    };

    // Helper to render one lane (A or B)
    const spacer = () => {
      const el = document.createElement('div');
      el.className = 'arrange-add-btn';
      el.style.visibility = 'hidden';
      el.style.pointerEvents = 'none';
      return el;
    };
    const renderLane = (variantKey) => {
      const lane = document.createElement('div');
      lane.className = 'arrange-lane';
      const lbl = document.createElement('div');
      lbl.className = 'arrange-lane-label';
      lbl.textContent = variantKey.toUpperCase();
      lbl.style.color = 'var(--accent)';
      lane.appendChild(lbl);
      const blocks = document.createElement('div');
      blocks.className = 'arrange-blocks';

      if (seq.length === 0) {
        blocks.appendChild(variantKey === 'a' ? makeAddBtn(0) : spacer());
        const empty = document.createElement('div');
        empty.className = 'arrange-lane-empty';
        empty.textContent = 'Click + to add a pattern';
        blocks.appendChild(empty);
      } else {
        // Beginning + button (only lane A)
        blocks.appendChild(variantKey === 'a' ? makeAddBtn(0) : spacer());

        seq.forEach((arrangedIdx, si) => {
          blocks.appendChild(makeBlock(arrangedIdx, si, variantKey));
        });

        // End + button
        blocks.appendChild(variantKey === 'a' ? makeAddBtn(seq.length) : spacer());
      }

      // ─── Drag-and-drop container handlers ───
      blocks.addEventListener('dragover', (e) => {
        e.preventDefault();
        const rect = blocks.getBoundingClientRect();
        const mouseX = e.clientX - rect.left + blocks.scrollLeft;
        const blockEls = blocks.querySelectorAll('.arrange-block');
        let insertIdx = seq.length;
        for (const bEl of blockEls) {
          const si = parseInt(bEl.dataset.si);
          const bMid = bEl.offsetLeft + bEl.offsetWidth / 2;
          if (mouseX < bMid) { insertIdx = si; break; }
          insertIdx = si + 1;
        }
        insertIdx = Math.max(0, Math.min(seq.length, insertIdx));
        if (insertIdx !== _dragInsertIdx) {
          _dragInsertIdx = insertIdx;
          document.querySelectorAll('.arrange-blocks .drag-placeholder').forEach(el => el.remove());
          showPlaceholder(blocks, insertIdx);
        }
      });
      blocks.addEventListener('dragleave', (e) => {
        if (!blocks.contains(e.relatedTarget)) {
          const ph = blocks.querySelector('.drag-placeholder');
          if (ph) ph.remove();
        }
      });
      blocks.addEventListener('drop', (e) => {
        e.preventDefault();
        const from = _dragSourceSi;
        document.querySelectorAll('.arrange-blocks .drag-placeholder').forEach(el => el.remove());
        if (from < 0 || from >= seq.length) return;
        let to = _dragInsertIdx;
        if (to < 0 || to > seq.length) return;
        if (from === to || from === to - 1) return;
        const item = seq.splice(from, 1)[0];
        seq.splice(from < to ? to - 1 : to, 0, item);
        state._notify();
        renderSongArranger();
        this.render();
      });

      lane.appendChild(blocks);
      wrap.appendChild(lane);
    };

    renderLane('a');
    renderLane('b');
    container.appendChild(wrap);
  }

  _createTrack(trackIdx) {
    const wrapper = document.createElement('div');
    wrapper.className = 'track-container';
    wrapper.id = `track-container-${trackIdx}`;
    if (this.state.isDrumTrack(trackIdx)) wrapper.classList.add('drum-mode');

    // ─── Заголовок ───
    const header = document.createElement('div');
    header.className = 'track-header';

    const name = document.createElement('span');
    name.className = 'track-name';
    name.style.color = CONFIG.TRACK_COLORS[trackIdx];
    name.textContent = `Track ${trackIdx + 1}`;

    // Выбор типа дорожки
    const typeSelect = document.createElement('select');
    typeSelect.dataset.track = trackIdx;
    typeSelect.dataset.control = 'type';
    ['melodic', 'drum'].forEach(type => {
      const opt = document.createElement('option');
      opt.value = type;
      opt.textContent = type === 'melodic' ? '♫ Melodic' : '♨ Drums';
      if (this.state.trackTypes[trackIdx] === type) opt.selected = true;
      typeSelect.appendChild(opt);
    });
    typeSelect.addEventListener('change', (e) => {
      this.state.setTrackType(trackIdx, e.target.value);
      this.render(); // перерисовка всей дорожки
    });

    // Выбор волны (для мелодических)
    const waveSelect = document.createElement('select');
    waveSelect.dataset.track = trackIdx;
    waveSelect.dataset.control = 'wave';
    if (this.state.isDrumTrack(trackIdx)) waveSelect.style.display = 'none';
    CONFIG.WAVE_TYPES.forEach(wave => {
      const opt = document.createElement('option');
      opt.value = wave;
      opt.textContent = wave.charAt(0).toUpperCase() + wave.slice(1);
      if (this.state.trackWaves[trackIdx] === wave) opt.selected = true;
      waveSelect.appendChild(opt);
    });
    waveSelect.addEventListener('change', (e) => {
      this.state.trackWaves[trackIdx] = e.target.value;
    });

    // Выбор режима синтеза (для барабанных)
    const soundModeSelect = document.createElement('select');
    soundModeSelect.dataset.track = trackIdx;
    soundModeSelect.dataset.control = 'drumMode';
    if (!this.state.isDrumTrack(trackIdx)) soundModeSelect.style.display = 'none';
    [
      { value: 'synth', label: 'Synth' },
      { value: 'sample', label: 'Sample' },
    ].forEach(mode => {
      const opt = document.createElement('option');
      opt.value = mode.value;
      opt.textContent = mode.label;
      if (this.state.drumSoundModes[trackIdx] === mode.value) opt.selected = true;
      soundModeSelect.appendChild(opt);
    });
    soundModeSelect.addEventListener('change', (e) => {
      this.state.drumSoundModes[trackIdx] = e.target.value;
    });

    // Выбор пресета
    const presetSelect = document.createElement('select');
    presetSelect.className = 'preset-select';
    const presets = this.state.isDrumTrack(trackIdx) ? PRESETS.drum : PRESETS.melodic;
    const emptyOpt = document.createElement('option');
    emptyOpt.value = ''; emptyOpt.textContent = 'Presets ▾';
    presetSelect.appendChild(emptyOpt);
    presets.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.name;
      presetSelect.appendChild(opt);
    });
    presetSelect.addEventListener('change', (e) => {
      const idx = parseInt(e.target.value);
      if (isNaN(idx)) return;
      const preset = presets[idx];
      this.state.pushHistory();
      if (this.state.isDrumTrack(trackIdx)) {
        // Очищаем дорожку
        for (let s = 0; s < this.state.steps; s++) {
          for (let d = 0; d < CONFIG.DRUM_INSTRUMENTS.length; d++) {
            this.state.drumPattern[trackIdx][s][d] = false;
          }
        }
        // Применяем пресет
        for (const [step, drumIdx] of preset.pattern) {
          if (step < this.state.steps) this.state.drumPattern[trackIdx][step][drumIdx] = true;
        }
      } else {
        // Очищаем дорожку
        for (let s = 0; s < this.state.steps; s++) {
          this.state.melodicPattern[trackIdx][s] = null;
        }
        // Применяем пресет
        for (const [step, midi] of preset.pattern) {
          if (step < this.state.steps) this.state.melodicPattern[trackIdx][step] = midi;
        }
      }
      // Обновляем UI
      this._updateAllMelodicNotes();
      this._updateAllDrumNotes();
      this.state._notify();
    });
    header.appendChild(name);
    header.appendChild(typeSelect);
    header.appendChild(waveSelect);
    header.appendChild(soundModeSelect);
    header.appendChild(presetSelect);

    const sourceMeta = this.state.trackSources?.[trackIdx];
    if (sourceMeta) {
      const chip = document.createElement('span');
      chip.className = 'source-chip';
      chip.title = [sourceMeta.genre, sourceMeta.kind, sourceMeta.source, sourceMeta.name].filter(Boolean).join(' · ');
      chip.textContent = 'Source: ' + (sourceMeta.name || sourceMeta.source || 'MIDI');
      header.appendChild(chip);

      const reloadBtn = document.createElement('button');
      reloadBtn.className = 'source-reload-btn';
      reloadBtn.textContent = '↻ Source';
      reloadBtn.title = 'Reload original loop into this track';
      reloadBtn.addEventListener('click', async () => {
        await loadLoopIntoTrack(sourceMeta.id, trackIdx, true);
      });
      header.appendChild(reloadBtn);
    }

    // Кнопка раскрытия панели синтезатора
    const toggleBtn = document.createElement('button');
    toggleBtn.className = 'synth-toggle-btn' + (this.state.synthPanelOpen[trackIdx] ? ' active' : '');
    toggleBtn.textContent = '⚙';
    toggleBtn.title = 'Synth settings (ADSR + Filter)';
    toggleBtn.addEventListener('click', () => {
      this.state.synthPanelOpen[trackIdx] = !this.state.synthPanelOpen[trackIdx];
      const panel = wrapper.querySelector('.synth-panel');
      if (panel) {
        panel.classList.toggle('open', this.state.synthPanelOpen[trackIdx]);
        toggleBtn.classList.toggle('active', this.state.synthPanelOpen[trackIdx]);
      }
    });
    header.appendChild(toggleBtn);

    // Кнопки Mute справа
    const muteGroup = document.createElement('div');
    muteGroup.className = 'mute-group';
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      const mBtn = document.createElement('button');
      mBtn.className = 'mute-btn' + (this.state.trackMute[t] ? ' muted' : '');
      mBtn.textContent = `${t + 1}`;
      mBtn.dataset.track = t;
      mBtn.title = `Mute track ${t + 1}`;
      mBtn.style.borderLeftColor = CONFIG.TRACK_COLORS[t];
      mBtn.addEventListener('click', () => {
        this.state.trackMute[t] = !this.state.trackMute[t];
        mBtn.classList.toggle('muted', this.state.trackMute[t]);
      });
      muteGroup.appendChild(mBtn);
    }
    header.appendChild(muteGroup);

    // ─── Транспортный блок (Play, Stop) ───
    const transportGroup = document.createElement('div');
    transportGroup.className = 'transport-group';
    this._transportGroup = transportGroup;

    const playBtn = document.createElement('button');
    playBtn.className = 'btn btn-transport';
    playBtn.id = 'btnPlay';
    playBtn.textContent = '▶';
    playBtn.title = 'Play (Space)';
    playBtn.addEventListener('click', () => {
      if (this.sequencer.isRunning) {
        this.sequencer.stop();
        this.updatePlayButton(false);
        this.updatePlayhead();
      } else {
        this.sequencer.start();
        this.updatePlayButton(true);
      }
    });
    transportGroup.appendChild(playBtn);

    const stopBtn = document.createElement('button');
    stopBtn.className = 'btn btn-transport';
    stopBtn.id = 'btnStop';
    stopBtn.textContent = '■';
    stopBtn.title = 'Stop (Escape)';
    stopBtn.addEventListener('click', () => {
      this.sequencer.stop();
      this.updatePlayButton(false);
      this.updatePlayhead();
    });
    transportGroup.appendChild(stopBtn);

    // Loop indicator
    const loopBtn = document.createElement('button');
    loopBtn.className = 'btn btn-transport';
    loopBtn.id = 'btnLoop';
    loopBtn.textContent = '↺';
    const hasLoop = this.state.locatorA > 0 || this.state.locatorB < this.state.steps;
    loopBtn.classList.toggle('active', hasLoop);
    loopBtn.title = hasLoop ? 'Loop active — click to reset' : 'Loop inactive';
    loopBtn.addEventListener('click', () => {
      if (this.state.locatorA > 0 || this.state.locatorB < this.state.steps) {
        this.state.locatorA = 0;
        this.state.locatorB = this.state.steps;
        this.state._notify();
        loopBtn.classList.remove('active');
        loopBtn.title = 'Loop inactive';
        const ruler = document.querySelector('.bar-ruler');
        if (ruler) this._updateRuler(ruler);
      }
    });
    transportGroup.appendChild(loopBtn);

    header.appendChild(transportGroup);

    wrapper.appendChild(header);

    // ─── Панель синтезатора (ADSR + Filter) ───
    const synthPanel = this._createSynthPanel(trackIdx);
    if (this.state.synthPanelOpen[trackIdx]) synthPanel.classList.add('open');
    wrapper.appendChild(synthPanel);

    // ─── Контент ───
    if (this.state.isDrumTrack(trackIdx)) {
      wrapper.appendChild(this._createDrumGrid(trackIdx));
    } else {
      wrapper.appendChild(this._createMelodicGrid(trackIdx));
    }

    return wrapper;
  }

  /* ─── Панель синтезатора (ADSR + Filter) ─── */
  _createSynthPanel(trackIdx) {
    const panel = document.createElement('div');
    panel.className = 'synth-panel';
    panel.id = `synth-panel-${trackIdx}`;
    if (this.state.isDrumTrack(trackIdx)) panel.classList.add('drum-panel');

    const isDrum = this.state.isDrumTrack(trackIdx);

    // ADSR секция
    const adsrSection = document.createElement('div');
    adsrSection.className = 'synth-section';

    const adsrLabel = document.createElement('div');
    adsrLabel.className = 'synth-section-label';
    adsrLabel.textContent = isDrum ? 'Env' : 'ADSR';
    adsrSection.appendChild(adsrLabel);

    // ADSR параметры: attack, decay, sustain, release
    const adsrParams = [
      { key: 'attack', label: 'A', min: 0.001, max: 0.5, step: 0.001, formatFn: (v) => v < 0.01 ? `${(v * 1000).toFixed(0)}ms` : `${v.toFixed(3)}s` },
      { key: 'decay', label: 'D', min: 0.001, max: 0.5, step: 0.001, formatFn: (v) => v < 0.01 ? `${(v * 1000).toFixed(0)}ms` : `${v.toFixed(3)}s` },
      { key: 'sustain', label: 'S', min: 0, max: 1, step: 0.01, formatFn: (v) => `${(v * 100).toFixed(0)}%` },
      { key: 'release', label: 'R', min: 0.01, max: 1, step: 0.01, formatFn: (v) => v < 0.1 ? `${(v * 1000).toFixed(0)}ms` : `${v.toFixed(3)}s` },
    ];

    // Для барабанных дорожек показываем упрощённый ADSR (только decay/release)
    const visibleAdsr = isDrum ? adsrParams.filter(p => p.key === 'decay' || p.key === 'release') : adsrParams;

    for (const param of visibleAdsr) {

      filterSection.appendChild(this._createFader({

        onChange: (v) => { this.state.trackFilter[trackIdx].frequency = v; },

      }));

      // Resonance (Q)
      filterSection.appendChild(this._createFader({
        label: 'Res',

        min: 0.1, max: 20, step: 0.1,

    } else {

      const filterSection = document.createElement('div');

      filterLabel.textContent = 'Filter';
      filterSection.appendChild(filterLabel);

      // Toggle фильтра (кнопка)
      const filterToggle = document.createElement('button');
      filterToggle.className = 'synth-toggle-btn';
      const updateFilterBtn = () => {
        const on = this.state.trackFilter[trackIdx].enabled;
        filterToggle.textContent = on ? 'FLT: ON' : 'FLT: OFF';
        filterToggle.classList.toggle('active', on);
        filterToggle.style.borderColor = on ? CONFIG.TRACK_COLORS[trackIdx] : 'var(--border)';
      };
      updateFilterBtn();
      filterToggle.addEventListener('click', () => {
        this.state.trackFilter[trackIdx].enabled = !this.state.trackFilter[trackIdx].enabled;
        updateFilterBtn();
      });
      filterSection.appendChild(filterToggle);

      // Тип фильтра
      filterSection.appendChild(this._createFilterTypeSelect(trackIdx));

      // Cutoff frequency
      const filt = this.state.trackFilter[trackIdx];
      filterSection.appendChild(this._createFader({
        label: 'Cutoff',

        onChange: (v) => { this.state.trackFilter[trackIdx].frequency = v; },

      // Resonance (Q)
      filterSection.appendChild(this._createFader({

      panel.appendChild(filterSection);

    return panel;
  }

  /* ─── Создание вертикального фейдера ─── */
  _createFader({ label, value, min, max, step, formatFn, onChange, color, isLog = false, isToggle = false }) {
    const group = document.createElement('div');
    group.className = 'fader-group';

    const valueDisplay = document.createElement('div');
    valueDisplay.className = 'fader-value';

    const track = document.createElement('div');
    track.className = 'fader-track';

    const fill = document.createElement('div');
    fill.className = 'fader-fill';
    fill.style.background = color;

    const thumb = document.createElement('div');
    thumb.className = 'fader-thumb';

    track.appendChild(fill);
    track.appendChild(thumb);

    const labelEl = document.createElement('label');
    labelEl.textContent = label;

    group.appendChild(valueDisplay);
    group.appendChild(track);
    group.appendChild(labelEl);

    // Конвертация значения в позицию (0-1)
    const toRatio = (v) => isLog
      ? (Math.log(v) - Math.log(min)) / (Math.log(max) - Math.log(min))
      : (v - min) / (max - min);

    const fromRatio = (r) => isLog
      ? Math.exp(Math.log(min) + r * (Math.log(max) - Math.log(min)))
      : min + r * (max - min);

    const updateVisual = (v) => {
      const ratio = isToggle ? v : Math.max(0, Math.min(1, toRatio(v)));
      fill.style.height = `${ratio * 100}%`;
      thumb.style.bottom = `${ratio * 100}%`;
      valueDisplay.textContent = formatFn(v);
    };

    updateVisual(value);

    // Обработка клика и перетаскивания
    let dragging = false;
    const setValue = (clientY) => {
      const rect = track.getBoundingClientRect();
      const ratio = 1 - (clientY - rect.top) / rect.height;
      const clamped = Math.max(0, Math.min(1, ratio));
      const newVal = isToggle ? (clamped > 0.5 ? 1 : 0) : fromRatio(clamped);
      const rounded = isToggle ? newVal : Math.round(newVal / step) * step;
      const final = Math.max(min, Math.min(max, rounded));
      onChange(final);
      updateVisual(final);
    };

    track.addEventListener('mousedown', (e) => {
      e.preventDefault();
      dragging = true;
      setValue(e.clientY);
    });
    document.addEventListener('mousemove', (e) => {
      if (dragging) setValue(e.clientY);
    });
    document.addEventListener('mouseup', () => { dragging = false; });

    track.addEventListener('touchstart', (e) => {
      e.preventDefault();
      dragging = true;
      setValue(e.touches[0].clientY);
    }, { passive: false });
    document.addEventListener('touchmove', (e) => {
      if (dragging) setValue(e.touches[0].clientY);
    });
    document.addEventListener('touchend', () => { dragging = false; });

    return group;
  }

  /* ─── Селект типа фильтра ─── */
  _createFilterTypeSelect(trackIdx) {
    const group = document.createElement('div');
    group.className = 'fader-group';

    const valueDisplay = document.createElement('div');
    valueDisplay.className = 'fader-value';

    const select = document.createElement('select');
    select.className = 'filter-type-select';
    select.style.width = '48px';
    ['lowpass', 'highpass', 'bandpass'].forEach(type => {
      const opt = document.createElement('option');
      opt.value = type;
      opt.textContent = type === 'lowpass' ? 'LP' : type === 'highpass' ? 'HP' : 'BP';
      if (this.state.trackFilter[trackIdx].type === type) opt.selected = true;
      select.appendChild(opt);
    });

    const label = document.createElement('label');
    label.textContent = 'Type';

    select.addEventListener('change', () => {
      this.state.trackFilter[trackIdx].type = select.value;
    });

    group.appendChild(valueDisplay);
    group.appendChild(select);
    group.appendChild(label);
    return group;
  }
  _createMelodicGrid(trackIdx) {
    const rollWrapper = document.createElement('div');
    rollWrapper.className = 'piano-roll-wrapper';

    const labels = document.createElement('div');
    labels.className = 'note-labels';
    // Ruler spacer at top of labels
    const rulerSpacer = document.createElement('div');
    rulerSpacer.className = 'ruler-spacer';
    labels.appendChild(rulerSpacer);
    for (let midi = CONFIG.NOTE_MAX; midi >= CONFIG.NOTE_MIN; midi--) {
      const lbl = document.createElement('div');
      lbl.className = 'note-label' + (isC(midi) ? ' c-note' : '');
      lbl.textContent = midiToName(midi);
      labels.appendChild(lbl);
    }

    const roll = document.createElement('div');
    roll.className = 'piano-roll';
    roll.dataset.track = trackIdx;
    const steps = this.state.steps;

    // Bar ruler
    roll.appendChild(this._createBarRuler());

    for (let midi = CONFIG.NOTE_MAX; midi >= CONFIG.NOTE_MIN; midi--) {
      const row = document.createElement('div');
      row.className = 'grid-row';
      if (isC(midi)) row.classList.add('c-row');
      if (isSharp(midi)) row.classList.add('sharp-row');

      for (let step = 0; step < steps; step++) {
        const cell = document.createElement('div');
        cell.className = 'grid-cell';
        cell.dataset.track = trackIdx;
        cell.dataset.step = step;
        cell.dataset.midi = midi;
        const beatGroup = (Math.floor(step / 16) % 2) * 2 + (Math.floor((step % 16) / 4) % 2);
        cell.classList.add('beat-group-' + beatGroup);
        if (step % 4 === 0) cell.classList.add('beat-start');
        if (this.state.toolMode === 'select') {
          cell.addEventListener('mousedown', (e) => {
            if (this.sequencer.audio.ctx?.state === 'suspended')
              this.sequencer.audio.ctx.resume();
            this.state.beginSelect(step);
            this._updateSelection();
            this._dragActive = true;
            e.preventDefault();
          });
          cell.addEventListener('mouseenter', (e) => {
            if (this._dragActive && (e.buttons & 1)) {
              this.state.extendSelect(step);
              this._updateSelection();
            }
          });
        } else {
          cell.addEventListener('click', () => {
            if (this.sequencer.audio.ctx?.state === 'suspended')
              this.sequencer.audio.ctx.resume();
            this.state.setMelodicNote(trackIdx, step, midi);
            this._updateMelodicStep(trackIdx, step);
          });
        }
        row.appendChild(cell);
      }
      roll.appendChild(row);
    }

    const playhead = document.createElement('div');
    playhead.className = 'playhead-overlay';
    playhead.id = `playhead-${trackIdx}`;
    roll.appendChild(playhead);

    rollWrapper.appendChild(labels);
    rollWrapper.appendChild(roll);

    // Номера шагов
    const stepNums = document.createElement('div');
    stepNums.className = 'step-numbers';
    for (let s = 0; s < steps; s++) {
      const num = document.createElement('div');
      num.className = 'step-num';
      num.textContent = s + 1;
      num.dataset.step = s;
      const beatGroup = (Math.floor(s / 16) % 2) * 2 + (Math.floor((s % 16) / 4) % 2);
      num.classList.add('beat-group-' + beatGroup);
      if (s % 4 === 0) num.classList.add('beat-start');
      if (this.state.toolMode === 'select') {

            this.state.extendSelect(s);
            this._updateSelection();
          }
        });
      }
      stepNums.appendChild(num);
    }

    return this._wrapFragment(rollWrapper, stepNums);
  }

    elements.forEach(el => div.appendChild(el));
    return div;

  /* ─── Создание bar ruler с локаторами ─── */
  _createBarRuler() {
    const steps = this.state.steps;
    const stepW = CONFIG.STEP_WIDTH;
    const ruler = document.createElement('div');
    ruler.className = 'bar-ruler';
    ruler.style.width = (steps * stepW) + 'px';
    ruler.style.minWidth = (steps * stepW) + 'px';

    for (let s = 0; s <= steps; s += 16) {
      const x = s * stepW;
      const line = document.createElement('div');
      line.className = 'ruler-bar-line';
      line.style.left = x + 'px';
      ruler.appendChild(line);
      if (s < steps) {
        const label = document.createElement('div');
        label.className = 'ruler-bar-label';
        label.style.left = (x + 4) + 'px';
        label.textContent = (s / 16) + 1;
        ruler.appendChild(label);
      }
    }

    const rangeFill = document.createElement('div');
    rangeFill.className = 'ruler-range-fill';
    ruler.appendChild(rangeFill);

    const locA = document.createElement('div');
    locA.className = 'ruler-locator';
    locA.dataset.loc = 'a';
    ruler.appendChild(locA);

    const locB = document.createElement('div');
    locB.className = 'ruler-locator';
    locB.dataset.loc = 'b';
    ruler.appendChild(locB);

    this._updateRuler(ruler);
    this._initLocatorDrag(ruler);
    return ruler;
  }

  /* ─── Обновление позиций локаторов и заливки ─── */
  _updateRuler(rulerEl) {
    if (!rulerEl) return;
    const la = this.state.locatorA;
    const lb = this.state.locatorB;
    const stepW = CONFIG.STEP_WIDTH;
    const locAEl = rulerEl.querySelector('.ruler-locator[data-loc="a"]');
    const locBEl = rulerEl.querySelector('.ruler-locator[data-loc="b"]');
    const rangeFill = rulerEl.querySelector('.ruler-range-fill');
    if (locAEl) locAEl.style.left = (la * stepW) + 'px';
    if (locBEl) locBEl.style.left = (lb * stepW) + 'px';
    if (rangeFill) {
      rangeFill.style.left = (la * stepW) + 'px';
      rangeFill.style.width = Math.max(0, (lb - la) * stepW) + 'px';
    }
  }

  /* ─── Drag для локаторов ─── */
  _initLocatorDrag(rulerEl) {
    let dragging = null;
    const self = this;

    const snapToBar = (step) => Math.round(step / 16) * 16;

    const onMove = (clientX) => {
      if (!dragging) return;
      const stepW = CONFIG.STEP_WIDTH;
      const rect = rulerEl.getBoundingClientRect();
      const x = clientX - rect.left;
      let step = snapToBar(Math.round(x / stepW));
      step = Math.max(0, Math.min(self.state.steps, step));

      if (dragging === 'a' && step < self.state.locatorB) {
        self.state.locatorA = step;
        self.state._notify();
        self._updateRuler(rulerEl);
      } else if (dragging === 'b' && step > self.state.locatorA) {
        self.state.locatorB = step;
        self.state._notify();
        self._updateRuler(rulerEl);
      }
    };

    rulerEl.querySelectorAll('.ruler-locator').forEach(el => {
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        dragging = el.dataset.loc;
        onMove(e.clientX);
      });
    });

    document.addEventListener('mousemove', (e) => {
      if (dragging) onMove(e.clientX);
    });

    document.addEventListener('mouseup', () => {
      if (dragging) {
        dragging = null;
        self._updateRuler(rulerEl);
      }
    });
  }

  /* ─── Инициализация ячеек ─── */
  _initMelodicCells() {
    this.melodicCells = [];
    const steps = this.state.steps;
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      this.melodicCells[t] = [];
      for (let s = 0; s < steps; s++) {
        this.melodicCells[t][s] = {};
      }
    }
    document.querySelectorAll('.grid-cell[data-midi]').forEach(cell => {
      const t = parseInt(cell.dataset.track);
      const s = parseInt(cell.dataset.step);
      const m = parseInt(cell.dataset.midi);
      if (this.melodicCells[t]?.[s]) this.melodicCells[t][s][m] = cell;
    });
  }

  _initDrumCells() {
    this.drumCells = [];
    const steps = this.state.steps;
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      this.drumCells[t] = [];
      for (let s = 0; s < steps; s++) {
        this.drumCells[t][s] = [];
      }
    }
    document.querySelectorAll('.drum-cell').forEach(cell => {
      const t = parseInt(cell.dataset.track);
      const s = parseInt(cell.dataset.step);
      const d = parseInt(cell.dataset.drum);
      if (this.drumCells[t]?.[s]) this.drumCells[t][s][d] = cell;
    });
  }

  _initPlayheads() {
    this.playheadEls = [];
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      this.playheadEls[t] = document.getElementById(`playhead-${t}`);
    }
  }

  /* ─── Подсветка выделения ─── */
  _updateSelection() {
    document.querySelectorAll('.grid-cell.selected').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('.drum-cell.selected').forEach(el => el.classList.remove('selected'));
    const ss = this.state.selStart;
    const se = this.state.selEnd;
    if (ss === -1 || se === -1) return;
    const min = Math.min(ss, se);
    const max = Math.max(ss, se);
    const track = this.state.activeTrack;
    if (!this.state.isDrumTrack(track)) {
      for (let s = min; s <= max; s++)
        document.querySelectorAll(`.grid-cell[data-track="${track}"][data-step="${s}"]`).forEach(el => el.classList.add('selected'));
    } else {
      for (let s = min; s <= max; s++)
        document.querySelectorAll(`.drum-cell[data-track="${track}"][data-step="${s}"]`).forEach(el => el.classList.add('selected'));
    }
  }

  /* ─── Курсор вставки ─── */
  _updatePasteCursor() {
    document.querySelectorAll('.step-num').forEach(el => {
      el.classList.remove('paste-target');
    });
    if (this.state.pasteCursor < 0) return;
    const el = document.querySelector(`.step-num[data-step="${this.state.pasteCursor}"]`);
    if (el) el.classList.add('paste-target');
  }

  /* ─── Обновление мелодических нот + ghost ─── */
  _updateMelodicStep(track, step) {
    for (let midi = CONFIG.NOTE_MIN; midi <= CONFIG.NOTE_MAX; midi++) {
      const cell = this.melodicCells[track]?.[step]?.[midi];
      if (cell) cell.innerHTML = '';
    }
    // Основная нота (текущая дорожка)
    const midi = this.state.melodicPattern[track][step];
    if (midi !== null) {
      const cell = this.melodicCells[track]?.[step]?.[midi];
      if (cell) {
        const block = document.createElement('div');
        block.className = 'note-block';
        block.style.background = CONFIG.TRACK_COLORS[track];
        cell.appendChild(block);
      }
    }
    // Ghost-ноты из других дорожек
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      if (t === track) continue;
      if (this.state.isDrumTrack(t)) {
        // Барабаны отображаются как ghost-ноты на фиксированных клавишах
        for (let d = 0; d < CONFIG.DRUM_INSTRUMENTS.length; d++) {
          if (this.state.isDrumActive(t, step, d)) {
            const ghostMidi = CONFIG.DRUM_NOTE_MAP[d];
            const cell = this.melodicCells[track]?.[step]?.[ghostMidi];
            if (cell && !cell.querySelector('.note-block:not(.ghost)')) {
              const block = document.createElement('div');
              block.className = 'note-block ghost';
              block.style.background = CONFIG.TRACK_COLORS[t];
              cell.appendChild(block);
            }
          }
        }
      } else {
        // Ghost мелодической ноты из другой мелодической дорожки
        const ghostMidi = this.state.melodicPattern[t][step];
        if (ghostMidi !== null) {
          const cell = this.melodicCells[track]?.[step]?.[ghostMidi];
          if (cell && !cell.querySelector('.note-block:not(.ghost)')) {
            const block = document.createElement('div');
            block.className = 'note-block ghost';
            block.style.background = CONFIG.TRACK_COLORS[t];
            cell.appendChild(block);
          }
        }
      }
    }
  }

  _updateAllMelodicNotes() {
    const t = this.state.activeTrack;
    if (this.state.isDrumTrack(t)) return;
    for (let s = 0; s < this.state.steps; s++) {
      this._updateMelodicStep(t, s);
    }
  }

  /* ─── Обновление барабанных ячеек + ghost ─── */
  _updateDrumCell(track, step, drumIdx) {
    const cell = this.drumCells[track]?.[step]?.[drumIdx];
    if (!cell) return;
    cell.innerHTML = '';
    // Основной барабан (текущая дорожка)
    if (this.state.isDrumActive(track, step, drumIdx)) {
      const block = document.createElement('div');
      block.className = 'drum-block';
      block.style.background = CONFIG.DRUM_INSTRUMENTS[drumIdx].color;
      cell.appendChild(block);
    }
    // Ghost из других барабанных дорожек
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      if (t === track || !this.state.isDrumTrack(t)) continue;
      if (this.state.isDrumActive(t, step, drumIdx)) {
        const ghost = document.createElement('div');
        ghost.className = 'drum-block ghost';
        ghost.style.background = CONFIG.DRUM_INSTRUMENTS[drumIdx].color;
        cell.appendChild(ghost);
        break;
      }
    }
  }

  _updateAllDrumNotes() {
    const t = this.state.activeTrack;
    if (!this.state.isDrumTrack(t)) return;
    for (let s = 0; s < this.state.steps; s++) {
      for (let d = 0; d < CONFIG.DRUM_INSTRUMENTS.length; d++) {
        this._updateDrumCell(t, s, d);
      }
    }
  }

  /* ─── Бегунок ─── */
  updatePlayhead() {
    const step = this.state.currentStep;
    if (step < 0 || !this.state.isPlaying) {
      for (const el of this.playheadEls) {
        if (el) el.style.display = 'none';
      }
      return;
    }

    const stepW = this.playheadEls[0]?.offsetWidth || CONFIG.STEP_WIDTH;
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      const el = this.playheadEls[t];
      if (el) {
        el.style.display = 'block';
        el.style.transform = `translateX(${step * stepW}px)`;
      }
    }
  }

  /* ─── Arrange playhead ─── */
  updateArrangePlayhead() {
    const el = this._arrangePlayheadEl;
    if (!el) return;
    const step = this.state.currentStep;
    if (step < 0 || !this.state.isPlaying) {
      el.style.display = 'none';
      return;
    }
    const seq = this.state.songSequence;
    const seqIdx = this.state.seqIndex;
    let pos = 0;
    for (let i = 0; i < seqIdx && i < seq.length; i++) {
      const ap = this.state._arrangedPatterns[seq[i]];
      const v = ap ? (ap._activeVariant === 'b' ? ap._variantB : ap._variantA) : null;
      const plen = v ? (v.patternLength || CONFIG.STEPS) : CONFIG.STEPS;
      pos += Math.max(1, plen / 16) * 40;
    }
    if (seqIdx >= 0 && seqIdx < seq.length) {
      const ap = this.state._arrangedPatterns[seq[seqIdx]];
      const v = ap ? (ap._activeVariant === 'b' ? ap._variantB : ap._variantA) : null;
      if (v) {
        const plen = v.patternLength || CONFIG.STEPS;
        const blockWidth = Math.max(1, plen / 16) * 40;
        pos += (Math.min(step, plen) / Math.max(1, plen)) * blockWidth;
      }
    }
    el.style.display = 'block';
    el.style.transform = `translateX(${pos}px)`;
  }

  updatePlayButton(isPlaying) {
    const btn = document.getElementById('btnPlay');
    if (btn) {
      btn.textContent = isPlaying ? '❚❚' : '▶';
      btn.classList.toggle('playing', isPlaying);
    }
    if (this._arrangePlayBtn) {
      this._arrangePlayBtn.textContent = isPlaying ? '❚❚' : '▶';
      this._arrangePlayBtn.classList.toggle('playing', isPlaying);
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   EMBEDDED LOOP BROWSER
   Reference Library → preview → load to active track → edit
   ═══════════════════════════════════════════════════════════ */
const loopBrowserEl = document.getElementById('loopBrowser');
const loopSearchEl = document.getElementById('loopSearch');
const loopGenreEl = document.getElementById('loopGenre');
const loopKindEl = document.getElementById('loopKind');
const loopSourceEl = document.getElementById('loopSource');
const loopListEl = document.getElementById('loopList');
const loopStatusEl = document.getElementById('loopStatus');
const loopCountEl = document.getElementById('loopCount');
const loopTargetEl = document.getElementById('loopTarget');
const LOOP_RENDER_LIMIT = 100;

let loopCatalog = [];
let loopCatalogLoaded = false;
let loopCatalogPromise = null;
let loopPreviewTimer = null;
let loopPreviewEntryId = null;

function loopEsc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function setLoopStatus(text, ok = false) {
  loopStatusEl.textContent = text;
  loopStatusEl.style.color = ok ? 'var(--accent)' : 'var(--text-dim)';
}

function updateLoopBrowserTarget() {
  if (!loopTargetEl) return;
  loopTargetEl.textContent = 'LOAD TO TRACK ' + (state.activeTrack + 1);
}

function fillLoopSelect(el, values, label) {
  const keep = el.value;
  el.innerHTML = '<option value="">' + label + '</option>';
  values.sort((a, b) => a.localeCompare(b)).forEach(value => {
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = value;
    el.appendChild(opt);
  });
  if (values.includes(keep)) el.value = keep;
}

async function ensureLoopCatalog() {
  if (loopCatalogLoaded) return loopCatalog;
  if (loopCatalogPromise) return loopCatalogPromise;
  setLoopStatus('Loading MIDI library index…');
  loopCatalogPromise = (async () => {
    const response = await fetch('/api/library');
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Library API error');
    loopCatalog = data.entries || [];
    loopCatalogLoaded = true;
    fillLoopSelect(loopGenreEl, [...new Set(loopCatalog.map(e => e.genre).filter(Boolean))], 'All styles');
    fillLoopSelect(loopKindEl, [...new Set(loopCatalog.map(e => e.kind).filter(Boolean))], 'All types');
    fillLoopSelect(loopSourceEl, [...new Set(loopCatalog.map(e => e.source).filter(Boolean))], 'All sources');
    setLoopStatus(
      'Ready · ' + loopCatalog.length.toLocaleString('ru-RU') + ' MIDI' +
      (data.mode === 'packs' ? ' · ' + Number(data.packCount || 0) + ' packs' : ''),
      true
    );
    renderLoopBrowser();
    return loopCatalog;
  })().finally(() => { loopCatalogPromise = null; });
  return loopCatalogPromise;
}

function loopIsLoadable(entry) {
  return !['chords', 'arrangement'].includes(entry.kind);
}

function filteredLoops() {
  const q = loopSearchEl.value.trim().toLowerCase();
  const genre = loopGenreEl.value;
  const kind = loopKindEl.value;
  const source = loopSourceEl.value;
  return loopCatalog.filter(entry => {
    if (genre && entry.genre !== genre) return false;
    if (kind && entry.kind !== kind) return false;
    if (source && entry.source !== source) return false;
    if (q) {
      const hay = [
        entry.name, entry.source, entry.member, entry.container,
        entry.genre, entry.kind, ...(entry.classificationRoles || [])
      ].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderLoopBrowser() {
  if (!loopCatalogLoaded) return;
  const filtered = filteredLoops();
  const rows = filtered.slice(0, LOOP_RENDER_LIMIT);
  loopCountEl.textContent = filtered.length.toLocaleString('ru-RU') + ' MIDI';
  if (!rows.length) {
    loopListEl.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:10px">Nothing found.</div>';
    return;
  }

  loopListEl.innerHTML = rows.map(entry => {
    const loadable = loopIsLoadable(entry);
    const barsHint = entry.kind === 'arrangement' ? 'multi' : entry.kind;
    return `<div class="loop-item" data-id="${loopEsc(entry.id)}">
      <button class="loop-preview-btn" title="Preview">▶</button>
      <div style="min-width:0">
        <div class="loop-name" title="${loopEsc(entry.member || entry.container || entry.name)}">${loopEsc(entry.name)}</div>
        <div class="loop-meta">${loopEsc(entry.genre)} · ${loopEsc(barsHint)} · ${loopEsc(entry.source)}</div>
      </div>
      <button class="loop-load-btn" ${loadable ? '' : 'disabled'} title="${loadable ? 'Load into active track' : 'Polyphonic arrangement/chords are preview-only in v1'}">LOAD</button>
    </div>`;
  }).join('');

  loopListEl.querySelectorAll('.loop-item').forEach(row => {
    const entry = loopCatalog.find(e => e.id === row.dataset.id);
    if (!entry) return;
    row.querySelector('.loop-preview-btn').addEventListener('click', async () => {
      await previewLoop(entry);
    });
    const loadBtn = row.querySelector('.loop-load-btn');
    if (!loadBtn.disabled) {
      loadBtn.addEventListener('click', async () => {
        await loadLoopIntoTrack(entry.id, state.activeTrack, false);
      });
    }
  });

  if (filtered.length > LOOP_RENDER_LIMIT) {
    const hint = document.createElement('div');
    hint.style.cssText = 'padding:8px;color:var(--text-dim);font-size:9px;text-align:center';
    hint.textContent = 'Showing first ' + LOOP_RENDER_LIMIT + ' · refine search/filters for more';
    loopListEl.appendChild(hint);
  }
}

async function fetchLoopMidi(entry) {
  const response = await fetch('/api/library/midi?id=' + encodeURIComponent(entry.id));
  if (!response.ok) {
    let message = 'MIDI load failed';
    try { message = (await response.json()).error || message; } catch {}
    throw new Error(message);
  }
  return parseReferenceMidi(await response.arrayBuffer());
}

function stopLoopPreview() {
  if (loopPreviewTimer) {
    clearTimeout(loopPreviewTimer);
    loopPreviewTimer = null;
  }
  loopPreviewEntryId = null;
  audio.stopAll();
}

async function previewLoop(entry) {
  try {
    if (sequencer.isRunning) sequencer.stop();
    stopLoopPreview();
    setLoopStatus('Preview loading · ' + entry.name);
    const midi = await fetchLoopMidi(entry);
    const ctx = audio.init();
    const start = ctx.currentTime + 0.06;
    const stepDuration = (60 / state.tempo) / 4;
    const tickPerStep = midi.ppq / 4;
    const maxSteps = Math.min(midiLoopStepCount(midi), 16 * 8);
    const maxTick = maxSteps * tickPerStep;
    const drums = entry.kind === 'drums' || midi.notes.filter(n => n.channel === 10).length > midi.notes.length * 0.6;
    loopPreviewEntryId = entry.id;

    for (const note of midi.notes) {
      if (note.tick >= maxTick) continue;
      const when = start + (note.tick / tickPerStep) * stepDuration;
      if (drums) {
        const drumIdx = gmDrumToIndex(note.note);
        if (drumIdx >= 0) audio.scheduleDrum(99, drumIdx, when, false);
      } else {
        if (note.channel === 10) continue;
        const duration = Math.max(0.04, Math.min(2.5, (note.duration / tickPerStep) * stepDuration));
        const track = state.activeTrack;
        audio.scheduleNote(
          99,
          foldMidiPitch(note.note),
          when,
          duration,
          state.trackWaves[track] || 'square',
          state.trackAdsr[track],
          state.trackFilter[track],
          state.adsrTarget[track],
          state.adsrDepth[track]
        );
      }
    }

    const previewSeconds = maxSteps * stepDuration;
    setLoopStatus(
      'Preview · ' + entry.name + ' · ' + (maxSteps / 16).toFixed(2).replace(/\.00$/, '') + ' bars @ project BPM',
      true
    );
    loopPreviewTimer = setTimeout(() => {
      if (loopPreviewEntryId === entry.id) {
        loopPreviewEntryId = null;
        setLoopStatus('Ready · choose another loop or LOAD to Track ' + (state.activeTrack + 1), true);
      }
    }, Math.max(250, previewSeconds * 1000 + 100));
  } catch (err) {
    setLoopStatus('Preview error: ' + err.message);
  }
}

async function loadLoopIntoTrack(entryId, trackIdx = state.activeTrack, isReload = false) {
  try {
    await ensureLoopCatalog();
    const entry = loopCatalog.find(e => e.id === entryId);
    if (!entry) throw new Error('Source MIDI is no longer in the library index');
    stopLoopPreview();
    setLoopStatus((isReload ? 'Reloading' : 'Loading') + ' · ' + entry.name + ' → Track ' + (trackIdx + 1));
    const midi = await fetchLoopMidi(entry);
    const beforeSteps = state.steps;
    state.loadMidiLoop(trackIdx, midi, entry);
    state.activeTrack = trackIdx;
    ui.render();
    const src = state.trackSources[trackIdx];
    const expanded = state.steps > beforeSteps ? ' · pattern expanded to ' + (state.steps / 16) + ' bars' : '';
    setLoopStatus(
      'Loaded · ' + entry.name + ' · source ' + src.originalBars + ' bars → filled ' +
      (state.steps / 16) + ' bars' + expanded,
      true
    );
  } catch (err) {
    setLoopStatus('Load error: ' + err.message);
  }
}

document.getElementById('btnLoops').addEventListener('click', async () => {

/* ─── Sync current constructor state to GitHub for AI review ─── */
function buildChiptuneOverview(project) {
  const ap = project._arrangedPatterns?.[project._editingIdx] || null;
  const variant = ap ? (ap._activeVariant === 'b' ? ap._variantB : ap._variantA) : null;
  const lines = [
    '# Chiptune Constructor Snapshot',
    '',
    '- Synced: ' + new Date().toISOString(),
    '- Project: ' + (project.name || 'Project'),
    '- BPM: ' + project.tempo,
    '- Swing: ' + project.swing + '%',
    '- Active pattern: ' + ((project._editingIdx ?? 0) + 1) + ' / ' + (project._arrangedPatterns?.length || 0),
    '- Pattern name: ' + (ap?.name || '—'),
    '- Variant: ' + ((ap?._activeVariant || 'a').toUpperCase()),
    '- Length: ' + ((variant?.patternLength || CONFIG.STEPS) / 16) + ' bars',
    '- Active track: ' + (state.activeTrack + 1),
    ''
  ];
  if (!variant) return lines.join('\n');

  for (let t = 0; t < CONFIG.TRACKS; t++) {
    const type = variant.trackTypes?.[t] || 'melodic';
    const source = variant.trackSources?.[t] || null;
    lines.push('## Track ' + (t + 1) + ' — ' + type);
    lines.push('Source: ' + (source
      ? [source.genre, source.kind, source.source, source.name].filter(Boolean).join(' · ')
      : 'manual / none'));
    if (type === 'drum') {
      const events = [];
      for (let step = 0; step < (variant.patternLength || CONFIG.STEPS); step++) {
        const active = [];
        for (let d = 0; d < CONFIG.DRUM_INSTRUMENTS.length; d++) {
          if (variant.drumPattern?.[t]?.[step]?.[d]) active.push(CONFIG.DRUM_INSTRUMENTS[d].name);
        }
        if (active.length) events.push((step + 1) + ':' + active.join('+'));
      }
      lines.push('Events: ' + (events.join(' ') || '—'));
    } else {
      const events = [];
      for (let step = 0; step < (variant.patternLength || CONFIG.STEPS); step++) {
        const note = variant.melodicPattern?.[t]?.[step];
        if (note !== null && note !== undefined) events.push((step + 1) + ':' + midiToName(note));
      }
      lines.push('Notes: ' + (events.join(' ') || '—'));
    }
    lines.push('');
  }
  return lines.join('\n');
}

// ─── Song mode ───
const songBtn = document.getElementById('btnSong');
const songGroup = document.getElementById('songGroup');
const songBlocksEl = document.getElementById('songBlocks');
const songAddBtn = document.getElementById('songAddBtn');

function renderSongArranger() {
  const seq = state.songSequence;
  songBlocksEl.innerHTML = '';
  if (seq.length === 0) return;
  seq.forEach((arrangedIdx, i) => {
    const ap = state._arrangedPatterns[arrangedIdx];
    const variant = ap ? (ap._activeVariant === 'b' ? ap._variantB : ap._variantA) : null;
    const bars = variant ? Math.max(1, variant.patternLength / 16) : 1;
    const block = document.createElement('div');
    block.className = 'song-block' + (i === state.seqIndex && state.isPlaying ? ' active' : '');
    block.style.width = (bars * 30) + 'px';
    block.dataset.idx = i;
    const label = ap ? ap._activeVariant.toUpperCase() : '?';
    const nameStr = ap && ap.name ? ap.name : '';
    block.title = nameStr ? nameStr + ' ' + label : label;
    if (ap && ap.name) {
      const nameSpan = document.createElement('span');
      nameSpan.className = 'block-name';
      nameSpan.textContent = nameStr;
      block.appendChild(nameSpan);
    }
    const numSpan = document.createElement('span');
    numSpan.className = 'block-num';
    numSpan.textContent = label;
    block.appendChild(numSpan);
    // Крестик удаления
    const delSpan = document.createElement('span');
    delSpan.className = 'block-del';
    delSpan.textContent = '✕';
    delSpan.addEventListener('click', (e) => {
      e.stopPropagation();
      if (seq.length <= 1) return;
      state.songSequence.splice(i, 1);
      if (state.seqIndex >= state.songSequence.length) state.seqIndex = 0;
      renderSongArranger();
    });
    block.appendChild(delSpan);
    // Клик — открыть в редакторе
    block.addEventListener('click', () => {
      state._saveToArranged(state._editingIdx);
      state._editingIdx = arrangedIdx;
      state._loadFromArranged(arrangedIdx);
      state.songMode = false;
      songBtn.classList.remove('active');
      songGroup.style.display = 'none';
      state.viewMode = 'edit';
      ui.render();
      document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === 'edit'));
    });
    block.addEventListener('contextmenu', (e) => {
      showPatternCtxMenu(e, arrangedIdx);
    });
    songBlocksEl.appendChild(block);
  });
}

songBtn.addEventListener('click', () => {
  state.songMode = !state.songMode;
  songBtn.classList.toggle('active', state.songMode);
  songGroup.style.display = state.songMode ? '' : 'none';
  if (state.songMode) {
    const cur = state.songSequence.indexOf(state._editingIdx);
    state.seqIndex = cur >= 0 ? cur : 0;
    renderSongArranger();
  } else {
    state.seqIndex = 0;
  }
});

songAddBtn.addEventListener('click', () => {
  state._saveToArranged(state._editingIdx);
  const empty = StateManager._makeEmptyPattern();
  const newData = {
    _variantA: empty,
    _variantB: StateManager._makeEmptyPattern(),
    _activeVariant: 'a',
    _undoStackA: [], _redoStackA: [],
    _undoStackB: [], _redoStackB: [],
    locatorA: 0,
    locatorB: empty.patternLength,
  };
  state._arrangedPatterns.push(newData);
  const newIdx = state._arrangedPatterns.length - 1;
  state.songSequence.push(newIdx);
  renderSongArranger();
});

// ─── Анимация бегунка ───
let lastAnimStep = -1;
let lastSeqIdx = -1;
function animatePlayhead() {
  if (state.isPlaying && sequencer.isRunning) {
    if (state.currentStep !== lastAnimStep) {
      lastAnimStep = state.currentStep;
      ui.updatePlayhead();
      if (state.viewMode === 'arrange') ui.updateArrangePlayhead();
    }
    if (state.seqIndex !== lastSeqIdx) {
      lastSeqIdx = state.seqIndex;
      if (state.songMode) renderSongArranger();
      if (state.viewMode === 'arrange') {
        ui.render();
        ui.updateArrangePlayhead();
      }
    }
  } else if (state.viewMode === 'arrange' && ui._arrangePlayheadEl) {
    ui._arrangePlayheadEl.style.display = 'none';
  }
  requestAnimationFrame(animatePlayhead);
}
requestAnimationFrame(animatePlayhead);

// ─── Горячие клавиши ───
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyA') {
    e.preventDefault();
    if (state.toolMode === 'select') {
      state.selStart = 0;
      state.selEnd = state.steps - 1;
      state.pasteCursor = -1;
      state._notify();
      ui.render();
    }
  }
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('btnPlay').click(); }
  if (e.code === 'Escape') { document.getElementById('btnStop').click(); }
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('btnUndo').click();
  }
  if ((e.ctrlKey || e.metaKey) && (e.code === 'KeyY' || (e.code === 'KeyZ' && e.shiftKey))) {
    e.preventDefault();
    document.getElementById('btnRedo').click();
  }
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyC') {
    e.preventDefault();
    if (state.selStart !== -1 && state.selEnd !== -1) {
      showCopyPasteDialog('copy', (mask) => { state.copy(mask); });
    }
  }
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyV') {
    e.preventDefault();
    if (state.clipboard) {
      showCopyPasteDialog('paste', (mask) => { state.paste(mask); ui.render(); });
    }
  }
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyD') {
    e.preventDefault();
    if (state.selStart !== -1 && state.selEnd !== -1) {
      state.copy();
      state.pasteCursor = state.selEnd + 1;
      state.paste();
      ui.render();
    }
  }
  if (e.code === 'Delete' || e.code === 'Backspace') {
    if (state.selStart !== -1 && state.selEnd !== -1) {
      e.preventDefault();
      state.deleteSelection();
      ui.render();
    }
  }
});

// ─── Copy/Paste track select dialog ───
function showCopyPasteDialog(mode, callback) {
  const overlay = document.createElement('div');
  overlay.className = 'cp-dialog-overlay';
  overlay.innerHTML = `
    <div class="cp-dialog">
      <div class="cp-dialog-title">${mode === 'copy' ? '📋 Copy — select tracks' : '📋 Paste — select tracks'}</div>
      <div class="cp-dialog-tracks">
        <label><input type="checkbox" data-track="0" checked> Track 1</label>
        <label><input type="checkbox" data-track="1" checked> Track 2</label>
        <label><input type="checkbox" data-track="2" checked> Track 3</label>
      </div>
      <div class="cp-dialog-buttons">
        <button class="btn" id="cpOk">${mode === 'copy' ? 'Copy' : 'Paste'}</button>
        <button class="btn" id="cpCancel">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) document.body.removeChild(overlay);
  });
  overlay.querySelector('#cpOk').addEventListener('click', () => {
    const mask = [];
    overlay.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      mask[parseInt(cb.dataset.track)] = cb.checked;
    });
    document.body.removeChild(overlay);
    callback(mask);
  });
  overlay.querySelector('#cpCancel').addEventListener('click', () => {
    document.body.removeChild(overlay);
  });
}

// ─── Context menu for pattern blocks (arrange + song) ───
let _pCtx = null;
let _pCtxIdx = -1;
function showPatternCtxMenu(e, arrangedIdx) {
  e.preventDefault();
  e.stopPropagation();
  if (!_pCtx) {
    _pCtx = document.createElement('div');
    _pCtx.className = 'pattern-ctx-menu';
    document.body.appendChild(_pCtx);
    document.addEventListener('click', (e) => {
      if (!_pCtx.contains(e.target)) { _pCtx.style.display = 'none'; _pCtxIdx = -1; }
    });
    document.addEventListener('contextmenu', (e) => {
      if (!_pCtx.contains(e.target)) { _pCtx.style.display = 'none'; _pCtxIdx = -1; }
    });
  }
  _pCtxIdx = arrangedIdx;
  _pCtx.innerHTML = '';
  _pCtx.style.display = 'block';
  _pCtx.style.left = e.clientX + 'px';
  _pCtx.style.top = e.clientY + 'px';

  const addItem = (label, fn, disabled) => {
    const el = document.createElement('div');
    el.className = 'ctx-item' + (disabled ? ' disabled' : '');
    el.textContent = label;
    if (!disabled) el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      _pCtx.style.display = 'none';
      _pCtxIdx = -1;
      fn();
    });
    _pCtx.appendChild(el);
  };

  const ap = state._arrangedPatterns[arrangedIdx];
  addItem('✏ Rename', () => {
    const n = prompt('Rename pattern:', ap && ap.name ? ap.name : '');
    if (n !== null) { state.renamePattern(arrangedIdx, n); ui.render(); if (state.songMode) renderSongArranger(); }
  });
  addItem('📋 Copy (all)', () => { state.copyPatternFromIdx(arrangedIdx, false); });
  addItem('🥁 Copy (drums only)', () => { state.copyPatternFromIdx(arrangedIdx, true); });
  const sep = document.createElement('div'); sep.className = 'ctx-sep'; _pCtx.appendChild(sep);
  addItem('📋 Paste', () => {
    state.pastePatternToIdx(arrangedIdx);
    ui.render();
    if (state.songMode) renderSongArranger();
  }, !state.patternClipboard);
  const sep2 = document.createElement('div'); sep2.className = 'ctx-sep'; _pCtx.appendChild(sep2);
  addItem('🗑 Delete', () => {
    if (state._arrangedPatterns.length <= 1) return;
    const delIdx = arrangedIdx;
    state._arrangedPatterns.splice(delIdx, 1);
    // Rebuild songSequence: remove references to delIdx, shift higher indices down
    const newSeq = [];
    for (let i = 0; i < state.songSequence.length; i++) {
      const ref = state.songSequence[i];
      if (ref === delIdx) continue;
      newSeq.push(ref > delIdx ? ref - 1 : ref);
    }
    state.songSequence = newSeq;
    // Adjust editing index
    if (state._editingIdx > delIdx) {
      state._editingIdx--;
    } else if (state._editingIdx === delIdx) {
      state._editingIdx = state._arrangedPatterns.length > 0 ? 0 : -1;
    }
    // Clamp seqIndex
    if (state.seqIndex >= state.songSequence.length) {
      state.seqIndex = Math.max(0, state.songSequence.length - 1);
    }
    state._notify();
    ui.render();
    if (state.songMode) renderSongArranger();
  }, state._arrangedPatterns.length <= 1);
}
