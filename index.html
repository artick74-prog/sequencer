<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiptune Piano Roll Sequencer</title>
<style>
/* ═══════════════════════════════════════════
   БАЗОВЫЕ СТИЛИ И РЕТРО-ТЕМА
   ═══════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-dark: #0a0a12;
  --bg-panel: #12121e;
  --bg-grid: #1a1a2e;
  --bg-cell: #22223a;
  --border: #2a2a44;
  --text: #c8c8e0;
  --text-dim: #6a6a88;
  --accent: #00e5ff;
  --accent-dim: #006978;
  --accent-pastel: #9ed4e6;
  --playhead: #ff4081;
  --track1: #ff6b6b;
  --track2: #4ecdc4;
  --track3: #ffe66d;
  --drum-bg: #1e1020;
  --drum-border: #3a2040;
  --note-h: 18px;
  --drum-row-h: 22px;
  --step-w: 32px;
  --label-w: 42px;
  --drum-label-w: 56px;
}

body {
  background: var(--bg-dark);
  color: var(--text);
  font-family: 'Courier New', monospace;
  font-size: 13px;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ═══════════════════════════════════════════
   ЗАГОЛОВОК
   ═══════════════════════════════════════════ */
.header {
  text-align: center;
  padding: 16px 0 8px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
}
.header h1 {
  font-size: 20px;
  letter-spacing: 4px;
  color: var(--accent);
  text-transform: uppercase;
  text-shadow: 0 0 10px var(--accent-dim);
}
.header .subtitle {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* ═══════════════════════════════════════════
   ПАНЕЛЬ УПРАВЛЕНИЯ
   ═══════════════════════════════════════════ */
.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
}
.btn {
  background: var(--bg-grid);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 14px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.btn:hover { background: var(--border); color: #fff; }
.btn.playing { background: var(--playhead); color: #fff; border-color: var(--playhead); }
.btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
.view-switcher { display: flex; gap: 2px; margin-left: auto; }
.view-btn { font-size: 10px !important; padding: 4px 8px !important; }
.song-arranger {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  max-width: 500px;
  overflow-x: auto;
}
.song-arranger label {
  color: var(--text-dim);
  font-size: 11px;
  text-transform: uppercase;
  flex-shrink: 0;
}
.song-blocks {
  display: flex;
  gap: 3px;
  align-items: center;
  flex-shrink: 0;
}
.song-block {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 24px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: rgba(158,212,230,0.1);
  cursor: pointer;
  font-size: 11px;
  font-weight: bold;
  color: #000;
  flex-shrink: 0;
  transition: all 0.1s;
}
.song-block:hover { border-color: var(--text-dim); }
.song-block .block-num {
  min-width: 12px;
  text-align: center;
}
.song-block .block-del {
  font-size: 9px;
  color: var(--text-dim);
  line-height: 1;
  margin-left: 2px;
}
.song-block .block-del:hover { color: var(--playhead); }
.song-block .block-name {
  font-size: 10px;
  opacity: 0.7;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 80px;
}
.song-block.active {
  background: var(--accent-pastel);
  color: #000;
  border-color: var(--accent-pastel);
}
.song-add-btn {
  height: 24px;
  width: 24px;
  flex-shrink: 0;
  border: 1px dashed var(--border);
  border-radius: 3px;
  background: transparent;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.1s;
}
.song-add-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.ctrl-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ctrl-group label {
  color: var(--text-dim);
  font-size: 11px;
  text-transform: uppercase;
}
.ctrl-group select, .ctrl-group input[type="range"] {
  background: var(--bg-grid);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 3px 6px;
  font-family: inherit;
  font-size: 11px;
  border-radius: 3px;
}
.ctrl-group input[type="range"] {
  width: 100px;
  accent-color: var(--accent);
}
.bpm-display {
  color: var(--accent);
  font-weight: bold;
  min-width: 36px;
  text-align: right;
}

/* ═══════════════════════════════════════════
   ДОРОЖКА (контейнер)
   ═══════════════════════════════════════════ */
.track-container {
  margin: 8px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  transition: background 0.2s, border-color 0.2s;
}
.track-container.drum-mode {
  background: var(--drum-bg);
  border-color: var(--drum-border);
}

.track-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
}
.track-header .track-name {
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.track-header select {
  background: var(--bg-grid);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 11px;
  padding: 2px 4px;
  border-radius: 3px;
}
.track-header .preset-select {
  width: 90px;
  font-size: 9px;
  opacity: 0.85;
  cursor: pointer;
}
.track-header .preset-select:hover {
  opacity: 1;
  border-color: var(--accent);
}

/* ═══════════════════════════════════════════
   Piano Roll (мелодическая дорожка)
   ═══════════════════════════════════════════ */
.piano-roll-wrapper {
  display: flex;
  overflow-x: auto;
  position: relative;
}
.note-labels {
  position: sticky;
  left: 0;
  z-index: 10;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  flex-shrink: 0;
  width: var(--label-w);
}
.note-label {
  height: var(--note-h);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 4px;
  font-size: 9px;
  color: var(--text-dim);
  border-bottom: 1px solid rgba(42, 42, 68, 0.4);
}
.note-label.c-note { color: var(--accent); font-weight: bold; }

.piano-roll {
  position: relative;
  flex-shrink: 0;
}
.grid-row {
  display: flex;
  height: var(--note-h);
  border-bottom: 1px solid rgba(42, 42, 68, 0.4);
}
.grid-row.c-row { border-bottom: 1px solid rgba(0, 229, 255, 0.2); }
.grid-row.sharp-row { background: rgba(0, 0, 0, 0.15); }

.grid-cell {
  width: var(--step-w);
  height: 100%;
  border-right: 1px solid rgba(42, 42, 68, 0.4);
  cursor: pointer;
  transition: background 0.08s;
  position: relative;
}
.grid-cell:hover { background: rgba(255, 255, 255, 0.06); }
.grid-cell.beat-group-1 { background: rgba(0,229,255,0.08); }
.grid-cell.beat-group-2 { background: rgba(255,255,255,0.04); }
.grid-cell.beat-group-3 { background: rgba(0,229,255,0.16); }
.grid-cell.beat-start { border-left: 1px solid rgba(255, 255, 255, 0.12); }
.grid-cell.selected { box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 8px rgba(0,229,255,0.25); }
.select-mode .grid-cell { cursor: crosshair; }
.select-mode .drum-cell { cursor: crosshair; }
.select-mode .step-num { cursor: crosshair; }

.note-block {
  position: absolute;
  top: 1px; left: 1px; right: 1px; bottom: 1px;
  border-radius: 2px;
  opacity: 0.85;
  pointer-events: none;
}
.note-block.ghost {
  opacity: 0.2;
  box-shadow: inset 0 0 2px rgba(255,255,255,0.15);
}
.drum-block.ghost {
  opacity: 0.2;
}

/* ═══════════════════════════════════════════
   Drum Grid (барабанная дорожка)
   ═══════════════════════════════════════════ */
.drum-grid-wrapper {
  display: flex;
  overflow-x: auto;
  position: relative;
}
.drum-labels {
  position: sticky;
  left: 0;
  z-index: 10;
  background: var(--drum-bg);
  border-right: 1px solid var(--drum-border);
  flex-shrink: 0;
  width: var(--drum-label-w);
}
.drum-label {
  height: var(--drum-row-h);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 6px;
  font-size: 9px;
  font-weight: bold;
  color: #d4a0d4;
  border-bottom: 1px solid rgba(58, 32, 64, 0.5);
  letter-spacing: 0.5px;
}

.drum-grid {
  position: relative;
  flex-shrink: 0;
}
.drum-row {
  display: flex;
  height: var(--drum-row-h);
  border-bottom: 1px solid rgba(58, 32, 64, 0.5);
}

.drum-cell {
  width: var(--step-w);
  height: 100%;
  border-right: 1px solid rgba(58, 32, 64, 0.5);
  cursor: pointer;
  transition: background 0.08s;
  position: relative;
}
.drum-cell:hover { background: rgba(255, 255, 255, 0.06); }
.drum-cell.beat-group-1 { background: rgba(0,229,255,0.08); }
.drum-cell.beat-group-2 { background: rgba(255,255,255,0.04); }
.drum-cell.beat-group-3 { background: rgba(0,229,255,0.16); }
.drum-cell.beat-start { border-left: 1px solid rgba(255, 255, 255, 0.12); }
.drum-cell.selected { box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 8px rgba(0,229,255,0.25); }

.drum-block {
  position: absolute;
  top: 2px; left: 2px; right: 2px; bottom: 2px;
  border-radius: 2px;
  opacity: 0.9;
  pointer-events: none;
  box-shadow: 0 0 4px rgba(212, 160, 212, 0.3);
}

/* ═══════════════════════════════════════════
   Бегунок текущего шага
   ═══════════════════════════════════════════ */
.playhead-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: var(--step-w);
  height: 100%;
  background: rgba(255, 64, 129, 0.10);
  border-left: 2px solid var(--playhead);
  border-right: 2px solid var(--playhead);
  pointer-events: none;
  z-index: 5;
  transition: transform 0.05s linear;
  display: none;
}

/* ═══════════════════════════════════════════
   Номера шагов
   ═══════════════════════════════════════════ */
.step-numbers {
  display: flex;
  margin-left: var(--label-w);
  border-top: 1px solid var(--border);
  background: var(--bg-panel);
}
.step-numbers.drum-steps {
  margin-left: var(--drum-label-w);
  background: var(--drum-bg);
  border-color: var(--drum-border);
}
.step-num {
  width: var(--step-w);
  text-align: center;
  font-size: 9px;
  color: var(--text-dim);
  padding: 2px 0;
  border-right: 1px solid rgba(42, 42, 68, 0.4);
}
.step-num.beat-group-1 { background: rgba(255,255,255,0.07); }
.step-num.beat-group-2 { background: rgba(255,255,255,0.04); }
.step-num.beat-group-3 { background: rgba(255,255,255,0.10); }
.step-num.beat-start { border-left: 1px solid rgba(255, 255, 255, 0.08); }
.step-num.paste-target { border-left: 2px solid var(--accent); color: var(--accent); font-weight: bold; }

/* ═══════════════════════════════════════════
   ПАНЕЛЬ СИНТЕЗАТОРА (ADSR + Filter)
   ═══════════════════════════════════════════ */
.synth-panel {
  display: none;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.2);
}
.synth-panel.open { display: block; }
.synth-panel.drum-panel {
  border-color: var(--drum-border);
  background: rgba(0, 0, 0, 0.15);
}

.synth-section {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  margin-bottom: 8px;
}
.synth-section:last-child { margin-bottom: 0; }

.synth-section-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-dim);
  padding-right: 8px;
  writing-mode: vertical-lr;
  transform: rotate(180deg);
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--border);
  margin-right: 8px;
}
.drum-panel .synth-section-label {
  border-color: var(--drum-border);
}

.fader-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 32px;
}
.fader-group label {
  font-size: 9px;
  color: var(--text-dim);
  text-transform: uppercase;
}
.fader-group .fader-value {
  font-size: 9px;
  color: var(--accent);
  font-weight: bold;
  min-height: 12px;
}

/* Вертикальный фейдер */
.fader-track {
  position: relative;
  width: 16px;
  height: 64px;
  background: var(--bg-grid);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
}
.drum-panel .fader-track { border-color: var(--drum-border); }

.fader-fill {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  border-radius: 3px;
  background: var(--accent);
  pointer-events: none;
  transition: height 0.05s;
}
.fader-thumb {
  position: absolute;
  left: -4px;
  width: 16px;
  height: 6px;
  background: #ddd;
  border: 1px solid #999;
  border-radius: 2px;
  pointer-events: none;
  transform: translateY(-50%);
}

/* ─── Табы переключения дорожек ─── */
.track-tabs {
  display: flex;
  gap: 0;
  padding: 0;
  margin-bottom: 0;
}
.track-tab {
  flex: 1;
  padding: 6px 8px;
  font-size: 11px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-bottom: none;
  color: var(--text-dim);
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
  border-left: 3px solid transparent;
  font-family: inherit;
}
.track-tab:hover {
  background: var(--bg-grid);
  color: var(--text);
}
.track-tab.active {
  background: var(--bg-grid);
  color: var(--text);
  font-weight: bold;
}

/* ─── Панель выбора паттерна ─── */
.pattern-bar {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 4px 6px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 4px 4px 0 0;
}
.pattern-label {
  font-size: 11px;
  font-weight: bold;
  color: var(--accent);
  margin-right: 6px;
  letter-spacing: 1px;
}
.pattern-btn {
  width: 26px; height: 26px;
  font-family: inherit;
  font-size: 10px;
  font-weight: bold;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg-grid);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.1s;
}
.pattern-btn:hover {
  border-color: var(--text-dim);
  color: var(--text);
}
.pattern-btn.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}
.pattern-btn.swap-source {
  background: var(--playhead);
  color: #fff;
  border-color: var(--playhead);
  box-shadow: 0 0 6px var(--playhead);
}
.swap-btn { width: 30px !important; font-size: 13px !important; line-height: 1; }
.variant-toggle {
  width: 32px; height: 26px;
  font-family: inherit;
  font-size: 12px;
  font-weight: bold;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg-grid);
  color: var(--accent);
  cursor: pointer;
  transition: all 0.1s;
  margin-right: 6px;
  letter-spacing: 0;
}
.variant-toggle:hover {
  border-color: var(--accent);
  box-shadow: 0 0 6px rgba(0,229,255,0.3);
}
.pattern-length-input {
  width: 48px; height: 26px;
  font-family: inherit;
  font-size: 11px;
  font-weight: bold;
  text-align: center;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg-grid);
  color: var(--text);
  outline: none;
}
.pattern-length-input:focus {
  border-color: var(--accent);
}

/* ─── Кнопка в панели синтезатора ─── */
.synth-toggle-btn {
  font-family: inherit;
  font-size: 10px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: var(--bg-grid);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.1s;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.synth-toggle-btn:hover {
  color: var(--text);
  border-color: var(--text-dim);
}
.synth-toggle-btn.active {
  background: var(--accent);
  color: #000;
  font-weight: bold;
}
.mute-group {
  display: flex;
  gap: 3px;
  align-items: center;
}
.mute-btn {
  font-family: inherit;
  font-size: 9px;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: 3px;
  background: var(--bg-grid);
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.1s;
  text-align: center;
  line-height: 20px;
  font-weight: bold;
}
.mute-btn:hover {
  border-color: var(--text-dim);
  color: var(--text);
}
.mute-btn.muted {
  background: #441111;
  border-color: #cc3333;
  color: #ff5555;
  opacity: 0.85;
}

/* ─── Транспортный блок ─── */
.transport-group {
  display: flex;
  gap: 3px;
  align-items: center;
  margin-left: auto;
}
.btn-transport {
  width: 36px;
  height: 26px;
  padding: 0;
  font-size: 13px;
  line-height: 24px;
  text-align: center;
}
.btn-transport.playing {
  background: var(--playhead);
  color: #fff;
  border-color: var(--playhead);
}

/* ═══════════════════════════════════════════
   BAR RULER + LOCATORS
   ═══════════════════════════════════════════ */
.bar-ruler {
  position: relative;
  height: 24px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
}
.ruler-bar-line {
  position: absolute;
  top: 0; width: 1px; height: 24px;
  background: var(--border);
  pointer-events: none;
}
.ruler-bar-label {
  position: absolute;
  top: 5px;
  font-size: 9px;
  color: var(--text-dim);
  pointer-events: none;
  user-select: none;
}
.ruler-range-fill {
  position: absolute;
  top: 0; height: 24px;
  background: rgba(158, 212, 230, 0.18);
  pointer-events: none;
  z-index: 1;
}
.ruler-locator {
  position: absolute;
  top: 0; width: 12px; height: 24px;
  margin-left: -6px;
  cursor: ew-resize;
  z-index: 3;
}
.ruler-locator::before {
  content: '';
  position: absolute;
  top: 0; left: 5px; width: 2px; height: 24px;
  background: var(--accent-pastel);
  pointer-events: none;
}
.ruler-locator::after {
  content: '';
  position: absolute;
  top: 2px; width: 8px; height: 12px;
  background: var(--accent-pastel);
  border-radius: 2px;
  pointer-events: none;
}
.ruler-locator[data-loc="a"]::after { left: 0; }
.ruler-locator[data-loc="b"]::after { right: 0; }
.ruler-spacer {
  height: 24px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
}

/* ═══════════════════════════════════════════
   АДАПТИВНОСТЬ
   ═══════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;

/* ═══════════════════════════════════════════════════════════
   УТИЛИТЫ
   ═══════════════════════════════════════════════════════════ */
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

function midiToName(midi) {
  const note = NOTE_NAMES[midi % 12];
  const octave = Math.floor(midi / 12) - 1;
  return note + octave;
}

function isSharp(midi) {
  return [1, 3, 6, 8, 10].includes(midi % 12);
}

function isC(midi) {
  return midi % 12 === 0;
}

/* ─── MIDI reference parser used by the embedded Loop Browser ─── */
function readReferenceVLQ(bytes, i) {
  let value = 0;
  for (let n = 0; n < 4; n++) {
    const b = bytes[i++];
    value = (value << 7) | (b & 0x7f);
    if ((b & 0x80) === 0) return [value, i];
  }
  throw new Error('Invalid MIDI VLQ');
}

function parseReferenceMidi(buffer) {
  const b = new Uint8Array(buffer);
  const u16 = i => (b[i] << 8) | b[i + 1];
  const u32 = i => ((b[i] << 24) >>> 0) + (b[i + 1] << 16) + (b[i + 2] << 8) + b[i + 3];
  if (String.fromCharCode(...b.slice(0, 4)) !== 'MThd') throw new Error('Not a MIDI file');
  const headerLen = u32(4);
  const nTracks = u16(10);
  const ppq = u16(12);
  if (ppq & 0x8000) throw new Error('SMPTE MIDI is not supported');

  let off = 8 + headerLen;
  let tempo = 120;
  let endTick = 0;
  const notes = [];

  for (let t = 0; t < nTracks; t++) {
    if (String.fromCharCode(...b.slice(off, off + 4)) !== 'MTrk') throw new Error('Missing MTrk');
    const end = off + 8 + u32(off + 4);
    let i = off + 8, tick = 0, running = 0;
    const open = new Map();

    while (i < end) {
      let delta; [delta, i] = readReferenceVLQ(b, i);
      tick += delta;
      endTick = Math.max(endTick, tick);

      let status = b[i];
      if (status < 0x80) {
        if (!running) throw new Error('Bad running status');
        status = running;
      } else {
        i++;
        running = status < 0xf0 ? status : 0;
      }

      if (status === 0xff) {
        const type = b[i++];
        let len; [len, i] = readReferenceVLQ(b, i);
        if (type === 0x51 && len === 3) {
          const us = (b[i] << 16) | (b[i + 1] << 8) | b[i + 2];
          if (us) tempo = 60000000 / us;
        }
        i += len;
        continue;
      }
      if (status === 0xf0 || status === 0xf7) {
        let len; [len, i] = readReferenceVLQ(b, i);
        i += len;
        continue;
      }

      const type = status & 0xf0;
      const channel = (status & 0x0f) + 1;
      if (type === 0x80 || type === 0x90) {
        const note = b[i++], velocity = b[i++], key = (channel << 8) | note;
        if (type === 0x90 && velocity > 0) {
          if (!open.has(key)) open.set(key, []);
          open.get(key).push({ tick, velocity });
        } else {
          const q = open.get(key);
          if (q?.length) {
            const on = q.shift();
            notes.push({
              tick: on.tick,
              duration: Math.max(1, tick - on.tick),
              note,
              velocity: on.velocity,
              channel,
            });
          }
        }
      } else if (type === 0xa0 || type === 0xb0 || type === 0xe0) {
        i += 2;
      } else if (type === 0xc0 || type === 0xd0) {
        i += 1;
      } else {
        throw new Error('Unsupported MIDI status 0x' + status.toString(16));
      }
    }
    off = end;
  }

  notes.sort((a, b2) => a.tick - b2.tick || a.note - b2.note);
  return { ppq, tempo, endTick, notes };
}

function midiLoopStepCount(midi) {
  const tickPerStep = midi.ppq / 4;
  let maxTick = Math.max(midi.endTick || 0, tickPerStep);
  for (const n of midi.notes || []) maxTick = Math.max(maxTick, n.tick + n.duration);
  return Math.max(1, Math.round(maxTick / tickPerStep));
}

function foldMidiPitch(note) {
  let pitch = Number(note) || 60;
  while (pitch < CONFIG.NOTE_MIN) pitch += 12;
  while (pitch > CONFIG.NOTE_MAX) pitch -= 12;
  return Math.max(CONFIG.NOTE_MIN, Math.min(CONFIG.NOTE_MAX, pitch));
}

function gmDrumToIndex(note) {
  if (note === 35 || note === 36) return 0; // kick
  if (note === 38 || note === 40) return 1; // snare
  if (note === 39) return 2;                // clap
  if (note === 42 || note === 44) return 3; // closed/pedal hat
  if (note === 46) return 4;                // open hat
  if ([41, 43, 45].includes(note)) return 5; // low/mid tom
  if ([47, 48, 50].includes(note)) return 6; // high tom
  if ([49, 51, 52, 53, 55, 57, 59].includes(note)) return 7; // cymbals
  return -1;
}

/* Генератор белого шума (используется для синтезатора барабанов) */
function createNoiseBuffer(ctx, duration) {
  const len = Math.ceil(ctx.sampleRate * duration);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    data[i] = Math.random() * 2 - 1;
  }
  return buf;
}

/* ═══════════════════════════════════════════════════════════
   PROJECT MANAGER
   Сохранение/загрузка полного проекта в localStorage + JSON
   ═══════════════════════════════════════════════════════════ */
class ProjectManager {
  constructor(state) {
    this.state = state;
    this.SAVE_KEY = 'chiptune_current_project';
  }

  /* Сохранить текущий проект в localStorage */
  saveCurrentProject() {
    const data = this.state.exportProject();
    localStorage.setItem(this.SAVE_KEY, JSON.stringify(data));
  }

  /* Загрузить проект из localStorage (v2 + legacy) */
  loadLastProject() {
    try {
      const raw = localStorage.getItem(this.SAVE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (data.version === 2) {
        this.state.loadProject(data);
        return true;
      }
      if (data._variantA) {
        // Legacy format in localStorage → wrap into v2
        const pl = data._variantA?.patternLength || CONFIG.STEPS;
        const project = {
          version: 2,
          name: data.name || 'Project',
          tempo: this.state.tempo,
          swing: this.state.swing,
          _arrangedPatterns: [{
            name: data.name || '',
            locatorA: data.locatorA ?? 0,
            locatorB: data.locatorB ?? pl,
            _activeVariant: data._activeVariant || 'a',
            _variantA: JSON.parse(JSON.stringify(data._variantA)),
            _variantB: data._variantB ? JSON.parse(JSON.stringify(data._variantB)) : null,
          }],
          songSequence: [0],
          seqIndex: 0,
          _editingIdx: 0,
          songMode: false,
        };
        this.state.loadProject(project);
        return true;
      }
      return false;
    } catch {
      return false;
    }
  }

  /* Экспорт полного проекта в JSON файл */
  exportToFile() {
    const data = this.state.exportProject();
    const name = data.name || 'project';
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${name.replace(/[^a-zа-я0-9_-]/gi, '_')}_${Date.now()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  /* Импорт проекта из JSON файла (v2 + legacy) */
  importFromFile(callback) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (data.version === 2) {
            this.state.loadProject(data);
            if (callback) callback(data);
          } else if (data._variantA) {
            // Legacy single-pattern format → wrap into v2 project
            const pl = data._variantA?.patternLength || CONFIG.STEPS;
            const project = {
              version: 2,
              name: data.name || 'Imported Pattern',
              tempo: this.state.tempo,
              swing: this.state.swing,
              _arrangedPatterns: [{
                name: data.name || '',
                locatorA: data.locatorA ?? 0,
                locatorB: data.locatorB ?? pl,
                _activeVariant: data._activeVariant || 'a',
                _variantA: JSON.parse(JSON.stringify(data._variantA)),
                _variantB: data._variantB ? JSON.parse(JSON.stringify(data._variantB)) : null,
              }],
              songSequence: [0],
              seqIndex: 0,
              _editingIdx: 0,
              songMode: false,
            };
            this.state.loadProject(project);
            if (callback) callback(project);
          } else {
            alert('Unsupported file format');
          }
        } catch (err) {
          console.error('Import error:', err);
          alert('Failed to load file');
        }
      };
      reader.readAsText(file);
    });
    input.click();
  }
}

/* ═══════════════════════════════════════════════════════════
   PATTERN LIBRARY
   Внутреннее хранилище паттернов по стилям (localStorage)
   ═══════════════════════════════════════════════════════════ */
class PatternLibrary {
  constructor(state) {
    this.state = state;
    this.LIB_KEY = 'chiptune_pattern_lib';
  }

  /* Получить все паттерны */
  getAll() {
    try { return JSON.parse(localStorage.getItem(this.LIB_KEY)) || []; }
    catch { return []; }
  }

  /* Сохранить список */
  _save(list) {
    localStorage.setItem(this.LIB_KEY, JSON.stringify(list));
  }

  /* Получить уникальные стили */
  getStyles() {
    const list = this.getAll();
    return [...new Set(list.map(p => p.style).filter(Boolean))].sort();
  }

  /* Сохранить текущий паттерн в библиотеку */
  savePattern(name, style) {
    this.state._saveToArranged(this.state._editingIdx);
    const list = this.getAll();
    const ap = this.state._arrangedPatterns[this.state._editingIdx];
    const vA = ap._variantA;
    const vB = ap._variantB;
    const entry = {
      id: Date.now(),
      name: name || 'Unnamed',
      style: style || '',
      savedAt: new Date().toISOString(),
      patternLength: vA.patternLength,
      variantA: {
        melodicPattern: vA.melodicPattern.map(t => t.map(s => s)),
        drumPattern: vA.drumPattern.map(t => t.map(s => [...s])),
        trackTypes: [...vA.trackTypes],
        trackWaves: [...vA.trackWaves],
        drumSoundModes: [...vA.drumSoundModes],
        trackAdsr: vA.trackAdsr.map(a => ({...a})),
        trackFilter: vA.trackFilter.map(f => ({...f})),
        adsrTarget: vA.adsrTarget.map(a => ({...a})),
        adsrDepth: vA.adsrDepth.map(d => ({...d})),
        trackMute: [...vA.trackMute],
        trackSources: (vA.trackSources || Array(CONFIG.TRACKS).fill(null)).map(src => src ? {...src} : null),
      },
      variantB: vB ? {
        melodicPattern: vB.melodicPattern.map(t => t.map(s => s)),
        drumPattern: vB.drumPattern.map(t => t.map(s => [...s])),
        trackTypes: [...vB.trackTypes],
        trackWaves: [...vB.trackWaves],
        drumSoundModes: [...vB.drumSoundModes],
        trackAdsr: vB.trackAdsr.map(a => ({...a})),
        trackFilter: vB.trackFilter.map(f => ({...f})),
        adsrTarget: vB.adsrTarget.map(a => ({...a})),
        adsrDepth: vB.adsrDepth.map(d => ({...d})),
        trackMute: [...vB.trackMute],
        trackSources: (vB.trackSources || Array(CONFIG.TRACKS).fill(null)).map(src => src ? {...src} : null),
      } : null,
    };
    list.push(entry);
    this._save(list);
    return entry;
  }

  /* Удалить паттерн из библиотеки */
  deletePattern(id) {
    let list = this.getAll();
    list = list.filter(p => p.id !== id);
    this._save(list);
  }

  /* Импортировать паттерн из библиотеки в аранжировку */
  importToArrangement(id) {
    const list = this.getAll();
    const entry = list.find(p => p.id === id);
    if (!entry) return null;

    const makeVariant = (src) => ({
      patternLength: entry.patternLength,
      melodicPattern: src.melodicPattern,
      drumPattern: src.drumPattern.map(t => t.map(s => [...s])),
      trackTypes: [...src.trackTypes],
      trackWaves: [...src.trackWaves],
      drumSoundModes: [...src.drumSoundModes],
      trackAdsr: src.trackAdsr.map(a => ({...a})),
      trackFilter: src.trackFilter.map(f => ({...f})),
      adsrTarget: src.adsrTarget.map(a => ({...a})),
      adsrDepth: src.adsrDepth.map(d => ({...d})),
      trackMute: [...src.trackMute],
      trackSources: (src.trackSources || Array(CONFIG.TRACKS).fill(null)).map(s => s ? {...s} : null),
    });

    const newIdx = this.state._arrangedPatterns.length;
    this.state._arrangedPatterns.push({
      _variantA: makeVariant(entry.variantA),
      _variantB: entry.variantB ? makeVariant(entry.variantB) : StateManager._makeEmptyPattern(entry.patternLength),
      _activeVariant: 'a',
      _undoStackA: [], _redoStackA: [],
      _undoStackB: [], _redoStackB: [],
      locatorA: 0,
      locatorB: entry.patternLength,
      name: entry.name,
    });
    this.state.songSequence.push(newIdx);

    // Switch edited pattern to the new one
    this.state._saveToArranged(this.state._editingIdx);
    this.state._editingIdx = newIdx;
    this.state._loadFromArranged(newIdx);
    this.state._activeVariant = 'a';
    this.state.currentStep = -1;

    return newIdx;
  }
}

/* ═══════════════════════════════════════════════════════════
   STATE MANAGER
   ═══════════════════════════════════════════════════════════ */
class StateManager {
  static _makeEmptyPattern(len = CONFIG.STEPS) {
    return {
      patternLength: len,
      melodicPattern: Array.from({ length: CONFIG.TRACKS }, () =>
        Array(len).fill(null)),
      drumPattern: Array.from({ length: CONFIG.TRACKS }, () =>
        Array.from({ length: len }, () =>
          new Array(CONFIG.DRUM_INSTRUMENTS.length).fill(false))),
      trackTypes: CONFIG.TRACK_TYPES.slice(),
      trackWaves: CONFIG.WAVE_TYPES.slice(),
      drumSoundModes: ['synth', 'synth', 'synth'],
      trackAdsr: Array.from({ length: CONFIG.TRACKS }, () => ({
        attack: 0.01, decay: 0.1, sustain: 0.7, release: 0.08,
      })),
      trackFilter: Array.from({ length: CONFIG.TRACKS }, () => ({
        enabled: true, type: 'lowpass', frequency: 8000, q: 1,
      })),
      adsrTarget: Array.from({ length: CONFIG.TRACKS }, () => ({ amp: true, filter: false })),
      adsrDepth: Array.from({ length: CONFIG.TRACKS }, () => ({ amp: 1, filter: 1 })),
      trackMute: [false, false, false],
      trackSources: Array(CONFIG.TRACKS).fill(null),
    };
  }

  constructor() {
    const p = StateManager._makeEmptyPattern();
    this.melodicPattern = p.melodicPattern;
    this.drumPattern = p.drumPattern;
    this.trackTypes = p.trackTypes;
    this.trackWaves = p.trackWaves;
    this.drumSoundModes = p.drumSoundModes;
    this.trackAdsr = p.trackAdsr;
    this.trackFilter = p.trackFilter;
    this.adsrTarget = p.adsrTarget;
    this.adsrDepth = p.adsrDepth;
    this.trackMute = p.trackMute;
    this.trackSources = p.trackSources;
    this.patternLength = p.patternLength;
    this.steps = this.patternLength;

    this.locatorA = 0;
    this.locatorB = this.patternLength;

    this.tempo = 130;
    this.swing = 0;
    this.isPlaying = false;
    this.currentStep = -1;
    this.activeTrack = 0;
    this.synthPanelOpen = [false, false, false];
    this._onChange = null;
    this._undoMax = 50;
    this._skipHistory = false;
    this.viewMode = 'edit'; // 'edit' | 'arrange'
    this.songMode = false;
    this.songSequence = [];
    this.seqIndex = 0;

    // Tool & selection
    this.toolMode = 'draw'; // 'draw' | 'select'
    this.selStart = -1;
    this.selEnd = -1;
    this.pasteCursor = -1;
    this.clipboard = null;
    this._copyTrackMask = null;
    this.patternClipboard = null;

    // Single pattern with A/B variants
    this._patternA = p;
    this._patternB = StateManager._makeEmptyPattern();
    this._activeVariant = 'a';
    this._undoStackA = [];
    this._redoStackA = [];
    this._undoStackB = [];
    this._redoStackB = [];
    this._undoStack = this._undoStackA;
    this._redoStack = this._redoStackA;

    // Store for arranged patterns
    this._arrangedPatterns = [];

    // Initialize first arranged pattern from current buffer
    this._arrangedPatterns.push(this._saveCurrentAsPatternData());
    this._editingIdx = 0;
    this.songSequence.push(0);
  }

  /* Вернуть данные текущего активного варианта */
  _getCurrentData() {
    return this._activeVariant === 'b' ? this._patternB : this._patternA;
  }

  /* Сохранить текущие стеки undo/redo */
  _saveStacks() {
    if (this._activeVariant === 'a') {
      this._undoStackA = this._undoStack;
      this._redoStackA = this._redoStack;
    } else {
      this._undoStackB = this._undoStack;
      this._redoStackB = this._redoStack;
    }
  }

  /* Загрузить стеки undo/redo */
  _loadStacks() {
    if (this._activeVariant === 'a') {
      this._undoStack = this._undoStackA;
      this._redoStack = this._redoStackA;
    } else {
      this._undoStack = this._undoStackB;
      this._redoStack = this._redoStackB;
    }
  }

  /* Создать snapshot текущего состояния как данные для хранения */
  _saveCurrentAsPatternData() {
    return {
      _variantA: JSON.parse(JSON.stringify(this._patternA)),
      _variantB: JSON.parse(JSON.stringify(this._patternB)),
      _activeVariant: this._activeVariant,
      _undoStackA: this._undoStackA,
      _redoStackA: this._redoStackA,
      _undoStackB: this._undoStackB,
      _redoStackB: this._redoStackB,
      locatorA: this.locatorA,
      locatorB: this.locatorB,
    };
  }

  /* Загрузить данные в редактор */
  _loadPatternData(data) {
    this._patternA = data._variantA;
    this._patternB = data._variantB || JSON.parse(JSON.stringify(data._variantA));
    this._activeVariant = data._activeVariant || 'a';
    this._undoStackA = data._undoStackA || [];
    this._redoStackA = data._redoStackA || [];
    this._undoStackB = data._undoStackB || [];
    this._redoStackB = data._redoStackB || [];
    if (data.locatorA !== undefined) this.locatorA = data.locatorA;
    if (data.locatorB !== undefined) this.locatorB = data.locatorB;
  }

  /* Переименовать паттерн в _arrangedPatterns */
  renamePattern(idx, newName) {
    if (idx < 0 || idx >= this._arrangedPatterns.length) return;
    this._arrangedPatterns[idx].name = newName;
    this._notify();
  }

  /* Сохранить текущее редактирование в конкретный элемент _arrangedPatterns */
  _saveToArranged(idx) {
    if (idx < 0 || idx >= this._arrangedPatterns.length) return;
    this._saveStateToVariant();
    const oldName = this._arrangedPatterns[idx].name;
    this._arrangedPatterns[idx] = this._saveCurrentAsPatternData();
    this._arrangedPatterns[idx].name = oldName;
  }

  /* Загрузить редактирование из конкретного элемента _arrangedPatterns */
  _loadFromArranged(idx) {
    if (idx < 0 || idx >= this._arrangedPatterns.length) return;
    this._loadPatternData(this._arrangedPatterns[idx]);
    this._loadVariantToState();
    this._loadStacks();
  }

  /* Скопировать активный вариант из _patternA/B в state */
  _loadVariantToState() {
    const d = this._getCurrentData();
    this.melodicPattern = d.melodicPattern;
    this.drumPattern = d.drumPattern;
    this.trackTypes = d.trackTypes;
    this.trackWaves = d.trackWaves;
    this.drumSoundModes = d.drumSoundModes;
    this.trackAdsr = d.trackAdsr;
    this.trackFilter = d.trackFilter;
    this.adsrTarget = d.adsrTarget || Array.from({ length: CONFIG.TRACKS }, () => ({ amp: true, filter: false }));
    this.adsrDepth = d.adsrDepth || Array.from({ length: CONFIG.TRACKS }, () => ({ amp: 1, filter: 1 }));
    this.trackMute = d.trackMute || [false, false, false];
    this.trackSources = (d.trackSources || Array(CONFIG.TRACKS).fill(null)).map(src => src ? {...src} : null);
    this.patternLength = d.patternLength ?? CONFIG.STEPS;
    this.steps = this.patternLength;
    this.locatorA = Math.max(0, Math.min(this.locatorA, this.patternLength));
    this.locatorB = Math.max(1, Math.min(this.locatorB, this.patternLength));
    if (this.locatorA >= this.locatorB) this.locatorA = 0;
    this.selStart = -1; this.selEnd = -1; this.pasteCursor = -1;
  }

  /* Скопировать state в активный вариант _patternA/B */
  _saveStateToVariant() {
    const d = this._getCurrentData();
    d.patternLength = this.patternLength;
    d.melodicPattern = this.melodicPattern;
    d.drumPattern = this.drumPattern.map(t => t.map(s => [...s]));
    d.trackTypes = [...this.trackTypes];
    d.trackWaves = [...this.trackWaves];
    d.drumSoundModes = [...this.drumSoundModes];
    d.trackAdsr = this.trackAdsr.map(a => ({...a}));
    d.trackFilter = this.trackFilter.map(f => ({...f}));
    d.adsrTarget = this.adsrTarget.map(a => ({...a}));
    d.adsrDepth = this.adsrDepth.map(d2 => ({...d2}));
    d.trackMute = [...this.trackMute];
    d.trackSources = this.trackSources.map(src => src ? {...src} : null);
  }

  /* Коллбэк, вызываемый при каждом изменении состояния */
  onChange(fn) { this._onChange = fn; }

  /* Снимок текущего состояния */
  _snapshot() {
    return JSON.stringify({
      patternLength: this.patternLength,
      melodicPattern: this.melodicPattern,
      drumPattern: this.drumPattern.map(t => t.map(s => [...s])),
      trackTypes: [...this.trackTypes],
      tempo: this.tempo,
      swing: this.swing,
      trackWaves: [...this.trackWaves],
      drumSoundModes: [...this.drumSoundModes],
      trackAdsr: this.trackAdsr.map(a => ({...a})),
      trackFilter: this.trackFilter.map(f => ({...f})),
      adsrTarget: [...this.adsrTarget],
      adsrDepth: this.adsrDepth.map(d => ({...d})),
      trackMute: [...this.trackMute],
      trackSources: this.trackSources.map(src => src ? {...src} : null),
    });
  }

  /* Восстановить из снапшота */
  _restore(json) {
    const d = JSON.parse(json);
    this.melodicPattern = d.melodicPattern;
    this.drumPattern = d.drumPattern;
    this.trackTypes = d.trackTypes;
    this.tempo = d.tempo;
    this.swing = d.swing;
    this.trackWaves = d.trackWaves;
    this.drumSoundModes = d.drumSoundModes;
    this.trackAdsr = d.trackAdsr;
    this.trackFilter = d.trackFilter;
    this.adsrTarget = d.adsrTarget || Array.from({ length: CONFIG.TRACKS }, () => ({ amp: true, filter: false }));
    this.adsrDepth = d.adsrDepth || Array.from({ length: CONFIG.TRACKS }, () => ({ amp: 1, filter: 1 }));
    this.trackMute = d.trackMute || [false, false, false];
    this.trackSources = (d.trackSources || Array(CONFIG.TRACKS).fill(null)).map(src => src ? {...src} : null);
    this.patternLength = d.patternLength ?? CONFIG.STEPS;
    this.steps = this.patternLength;
    this._saveStateToVariant();
  }

  /* Пушнуть текущий state в undo-стек */
  pushHistory() {
    if (this._skipHistory) return;
    this._undoStack.push(this._snapshot());
    if (this._undoStack.length > this._undoMax) this._undoStack.shift();
    this._redoStack = [];
  }

  undo() {
    if (this._undoStack.length === 0) return false;
    this._redoStack.push(this._snapshot());
    this._skipHistory = true;
    this._restore(this._undoStack.pop());
    this._skipHistory = false;
    return true;
  }

  redo() {
    if (this._redoStack.length === 0) return false;
    this._undoStack.push(this._snapshot());
    this._skipHistory = true;
    this._restore(this._redoStack.pop());
    this._skipHistory = false;
    return true;
  }

  canUndo() { return this._undoStack.length > 0; }
  canRedo() { return this._redoStack.length > 0; }

  _notify() {
    if (this._onChange) this._onChange();
    if (this._autosaveFn) this._autosaveFn();
  }

  /* Сохранить state в variant, переключить variant, загрузить variant */
  toggleVariant() {
    this._saveStateToVariant();
    this._saveStacks();
    this._activeVariant = this._activeVariant === 'a' ? 'b' : 'a';
    this._loadVariantToState();
    this._loadStacks();
    this.currentStep = -1;
    this._skipHistory = false;
    this.steps = this.patternLength;
    this.selStart = -1; this.selEnd = -1; this.pasteCursor = -1;
    this._notify();
  }

  /* Переключение на другой аранжированный паттерн (используется при клике в Arrange) */
  switchSongPattern(arrangedIdx) {
    if (arrangedIdx < 0 || arrangedIdx >= this._arrangedPatterns.length) return;
    this._saveToArranged(this._editingIdx);
    this._editingIdx = arrangedIdx;
    this._loadFromArranged(arrangedIdx);
  }

  /* ─── Tool / Selection / Copy-Paste ─── */
  setTool(mode) {
    if (this.toolMode === mode) return;
    this.toolMode = mode;
    this.selStart = -1;
    this.selEnd = -1;
    this.pasteCursor = -1;
    this._notify();
  }

  beginSelect(step) {
    this.selStart = step;
    this.selEnd = step;
    this.pasteCursor = -1;
    this._notify();
  }

  extendSelect(step) {
    this.selEnd = step;
    // normalize not needed here – _updateSelection handles it
    this._notify();
  }

  endSelect() {
    if (this.selStart !== -1 && this.selEnd !== -1) {
      if (this.selEnd < this.selStart) [this.selStart, this.selEnd] = [this.selEnd, this.selStart];
      // single click = курсор В ЭТОМ шаге, drag = после выделения
      this.pasteCursor = (this.selStart === this.selEnd) ? this.selStart : this.selEnd + 1;
    }
    this._notify();
  }

  copy(trackMask) {
    if (this.selStart === -1 || this.selEnd === -1) return;
    const mask = trackMask || [true, true, true];
    const len = this.selEnd - this.selStart + 1;
    const data = [];
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      if (!mask[t]) {
        data.push(null);
        continue;
      }
      const melodic = [];
      const drum = [];
      for (let s = this.selStart; s <= this.selEnd; s++) {
        melodic.push(this.melodicPattern[t][s]);
        drum.push(this.drumPattern[t][s] ? [...this.drumPattern[t][s]] : null);
      }
      data.push({ melodic, drum });
    }
    this.clipboard = { data, length: len, trackTypes: this.trackTypes.slice() };
    this._copyTrackMask = mask;
    this._notify();
  }

  paste(trackMask) {
    if (!this.clipboard) return;
    const target = this.pasteCursor !== -1 ? this.pasteCursor :
                   this.selEnd !== -1 ? this.selEnd + 1 : 0;
    const maxLen = this.steps - target;
    if (maxLen <= 0) return;
    const len = Math.min(this.clipboard.length, maxLen);
    const mask = trackMask || this._copyTrackMask || [true, true, true];
    this.pushHistory();
    if (this.clipboard.trackTypes) this.trackTypes = this.clipboard.trackTypes.slice();
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      if (!mask[t]) continue;
      if (!this.clipboard.data[t]) continue;
      for (let i = 0; i < len; i++) {
        const s = target + i;
        this.melodicPattern[t][s] = this.clipboard.data[t].melodic[i];
        this.drumPattern[t][s] = this.clipboard.data[t].drum[i]
          ? [...this.clipboard.data[t].drum[i]]
          : new Array(CONFIG.DRUM_INSTRUMENTS.length).fill(false);
      }
    }
    this.pasteCursor = target + len;
    this._notify();
  }

  duplicate() {
    if (this.selStart === -1 || this.selEnd === -1) return;
    this.copy();
    this.pasteCursor = this.selEnd + 1;
    this.paste();
  }

  /* Скопировать целый паттерн из _arrangedPatterns */
  copyPatternFromIdx(idx, drumsOnly) {
    if (idx < 0 || idx >= this._arrangedPatterns.length) return;
    if (idx === this._editingIdx) this._saveToArranged(idx);
    const data = this._arrangedPatterns[idx];
    this.patternClipboard = {
      variantA: JSON.parse(JSON.stringify(data._variantA)),
      variantB: data._variantB ? JSON.parse(JSON.stringify(data._variantB)) : null,
      name: data.name,
      drumsOnly: !!drumsOnly,
    };
    this._notify();
  }

  /* Вставить целый паттерн в _arrangedPatterns */
  pastePatternToIdx(idx) {
    if (idx < 0 || idx >= this._arrangedPatterns.length || !this.patternClipboard) return;
    const pc = this.patternClipboard;
    const target = this._arrangedPatterns[idx];
    if (pc.drumsOnly) {
      target._variantA.drumPattern = JSON.parse(JSON.stringify(pc.variantA.drumPattern));
      if (target._variantB && pc.variantB) {
        target._variantB.drumPattern = JSON.parse(JSON.stringify(pc.variantB.drumPattern));
      }
    } else {
      target._variantA = JSON.parse(JSON.stringify(pc.variantA));
      target._variantB = pc.variantB ? JSON.parse(JSON.stringify(pc.variantB)) : null;
    }
    if (idx === this._editingIdx) {
      this._loadFromArranged(idx);
    }
    this._notify();
  }

  deleteSelection() {
    if (this.selStart === -1 || this.selEnd === -1) return;
    this.pushHistory();
    for (let s = this.selStart; s <= this.selEnd; s++) {
      for (let t = 0; t < CONFIG.TRACKS; t++) {
        this.melodicPattern[t][s] = null;
        this.drumPattern[t][s] = new Array(CONFIG.DRUM_INSTRUMENTS.length).fill(false);
      }
    }
    this._notify();
  }

  isDrumTrack(track) {
    return this.trackTypes[track] === 'drum';
  }

  setTrackType(track, type) {
    this.pushHistory();
    this.trackTypes[track] = type;
    this._notify();
  }

  /* Import a parsed reference MIDI into one editable track and repeat it to pattern length. */
  loadMidiLoop(track, midi, entry) {
    if (!midi || !midi.ppq || !Array.isArray(midi.notes)) return false;
    const loopSteps = midiLoopStepCount(midi);
    if (loopSteps > this.steps) {
      const expanded = Math.min(CONFIG.MAX_STEPS, Math.ceil(loopSteps / 16) * 16);
      this.setPatternLength(expanded);
    }

    this.pushHistory();
    const isDrums = entry?.kind === 'drums' || midi.notes.filter(n => n.channel === 10).length > midi.notes.length * 0.6;
    this.trackTypes[track] = isDrums ? 'drum' : 'melodic';

    for (let s = 0; s < this.steps; s++) {
      this.melodicPattern[track][s] = null;
      this.drumPattern[track][s] = new Array(CONFIG.DRUM_INSTRUMENTS.length).fill(false);
    }

    const tickPerStep = midi.ppq / 4;
    if (isDrums) {
      const baseHits = [];
      for (const note of midi.notes) {
        const drumIdx = gmDrumToIndex(note.note);
        if (drumIdx < 0) continue;
        const step = Math.max(0, Math.min(loopSteps - 1, Math.round(note.tick / tickPerStep)));
        baseHits.push([step, drumIdx]);
      }
      for (let offset = 0; offset < this.steps; offset += loopSteps) {
        for (const [baseStep, drumIdx] of baseHits) {
          const step = offset + baseStep;
          if (step < this.steps) this.drumPattern[track][step][drumIdx] = true;
        }
      }
    } else {
      const byStep = new Map();
      for (const note of midi.notes) {
        if (note.channel === 10) continue;
        const step = Math.max(0, Math.min(loopSteps - 1, Math.round(note.tick / tickPerStep)));
        const pitch = foldMidiPitch(note.note);
        const prev = byStep.get(step);
        if (!prev) {
          byStep.set(step, {pitch, velocity: note.velocity || 0});
        } else if (entry?.kind === 'bass') {
          if (pitch < prev.pitch || (pitch === prev.pitch && (note.velocity || 0) > prev.velocity)) {
            byStep.set(step, {pitch, velocity: note.velocity || 0});
          }
        } else if ((note.velocity || 0) >= prev.velocity) {
          byStep.set(step, {pitch, velocity: note.velocity || 0});
        }
      }
      for (let offset = 0; offset < this.steps; offset += loopSteps) {
        for (const [baseStep, value] of byStep) {
          const step = offset + baseStep;
          if (step < this.steps) this.melodicPattern[track][step] = value.pitch;
        }
      }
    }

    this.trackSources[track] = {
      id: entry?.id || '',
      name: entry?.name || 'MIDI loop',
      source: entry?.source || '',
      genre: entry?.genre || '',
      kind: entry?.kind || (isDrums ? 'drums' : 'melody'),
      originalSteps: loopSteps,
      originalBars: Number((loopSteps / 16).toFixed(2)),
      loadedAt: new Date().toISOString(),
    };
    this._notify();
    return true;
  }

  setMelodicNote(track, step, midi) {
    this.pushHistory();
    if (this.melodicPattern[track][step] === midi) {
      this.melodicPattern[track][step] = null;
    } else {
      this.melodicPattern[track][step] = midi;
    }
    this._notify();
  }

  toggleDrum(track, step, drumIdx) {
    this.pushHistory();
    this.drumPattern[track][step][drumIdx] = !this.drumPattern[track][step][drumIdx];
    this._notify();
  }

  isDrumActive(track, step, drumIdx) {
    return this.drumPattern[track][step][drumIdx] === true;
  }

  getPatternNoteCount(arrangedIdx, trackIdx) {
    const ap = this._arrangedPatterns[arrangedIdx];
    if (!ap) return 0;
    const variant = ap._activeVariant === 'b' ? ap._variantB : ap._variantA;
    if (!variant) return 0;
    const steps = variant.patternLength || CONFIG.STEPS;
    let count = 0;
    if (this.trackTypes[trackIdx] === 'drum') {
      for (let s = 0; s < steps; s++)
        for (let d = 0; d < CONFIG.DRUM_INSTRUMENTS.length; d++)
          if (variant.drumPattern[trackIdx]?.[s]?.[d]) count++;
    } else {
      for (let s = 0; s < steps; s++)
        if (variant.melodicPattern[trackIdx]?.[s] !== null && variant.melodicPattern[trackIdx]?.[s] !== undefined) count++;
    }
    return count;
  }

  clearAll() {
    this.pushHistory();
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      for (let s = 0; s < this.steps; s++) {
        this.melodicPattern[t][s] = null;
        for (let d = 0; d < CONFIG.DRUM_INSTRUMENTS.length; d++) {
          this.drumPattern[t][s][d] = false;
        }
      }
      this.trackSources[t] = null;
    }
    this._notify();
  }

  setPatternLength(n) {
    const clamped = Math.max(CONFIG.MIN_STEPS, Math.min(CONFIG.MAX_STEPS, n));
    if (clamped === this.steps) return;
    this.pushHistory();
    const oldLen = this.steps;
    this.patternLength = clamped;
    this.steps = clamped;
    this.selStart = -1; this.selEnd = -1; this.pasteCursor = -1;
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      if (clamped > oldLen) {
        this.melodicPattern[t].push(...Array(clamped - oldLen).fill(null));
        this.drumPattern[t].push(...Array.from({ length: clamped - oldLen }, () =>
          new Array(CONFIG.DRUM_INSTRUMENTS.length).fill(false)));
      } else {
        this.melodicPattern[t].length = clamped;
        this.drumPattern[t].length = clamped;
      }
    }
    // Синхронизируем длину с неактивным вариантом
    const inactive = this._activeVariant === 'a' ? this._patternB : this._patternA;
    inactive.patternLength = clamped;
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      const inactLen = inactive.melodicPattern[t].length;
      if (clamped > inactLen) {
        inactive.melodicPattern[t].push(...Array(clamped - inactLen).fill(null));
        inactive.drumPattern[t].push(...Array.from({ length: clamped - inactLen }, () =>
          new Array(CONFIG.DRUM_INSTRUMENTS.length).fill(false)));
      } else {
        inactive.melodicPattern[t].length = clamped;
        inactive.drumPattern[t].length = clamped;
      }
    }
    // Корректируем локаторы
    if (this.locatorB > clamped) this.locatorB = clamped;
    if (this.locatorA >= this.locatorB) this.locatorA = 0;
    // Если играем, корректируем текущий шаг, чтобы он не вылез за границы
    if (this.currentStep >= clamped) this.currentStep = 0;
    this._notify();
  }

  getMelodicNotesAtStep(step) {
    const result = new Map();
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      if (!this.isDrumTrack(t) && this.melodicPattern[t][step] !== null) {
        result.set(t, this.melodicPattern[t][step]);
      }
    }
    return result;
  }

  getDrumNotesAtStep(step) {
    const result = new Map(); // track -> Set<drumIdx>
    for (let t = 0; t < CONFIG.TRACKS; t++) {
      if (this.isDrumTrack(t)) {
        const active = new Set();
        for (let d = 0; d < CONFIG.DRUM_INSTRUMENTS.length; d++) {
          if (this.drumPattern[t][step][d]) {
            active.add(d);
          }
        }
        if (active.size > 0) {
          result.set(t, active);
        }
      }
    }
    return result;
  }

  /* Экспорт текущего паттерна (обе вариации) */
  exportMidi() {
    this._saveStateToVariant();
    const data = this._saveCurrentAsPatternData();
    data.name = this._arrangedPatterns[this._editingIdx]?.name || '';
    return data;
  }

  loadPattern(data) {
    this.pushHistory();
    if (data._variantA && data._variantB) {
      this._loadPatternData(data);
      this._loadVariantToState();
      this._loadStacks();
    } else {
      // Legacy single-variant data
      if (data.patternLength) { this.patternLength = data.patternLength; this.steps = data.patternLength; }
      if (data.locatorA === undefined) { this.locatorA = 0; this.locatorB = this.steps; }
      const d = this._getCurrentData();
      if (data.melodicPattern) d.melodicPattern = data.melodicPattern;
      if (data.drumPattern) d.drumPattern = data.drumPattern;
      if (data.trackTypes) d.trackTypes = data.trackTypes;
      if (data.trackWaves) d.trackWaves = data.trackWaves;
      if (data.drumSoundModes) d.drumSoundModes = data.drumSoundModes;
      if (data.adsrTarget) d.adsrTarget = data.adsrTarget;
      if (data.adsrDepth) d.adsrDepth = data.adsrDepth;
      this._loadVariantToState();
    }
    // Sync back to arranged store and restore name
    this._arrangedPatterns[this._editingIdx] = this._saveCurrentAsPatternData();
    if (data.name) this._arrangedPatterns[this._editingIdx].name = data.name;
    this._notify();
  }

  /* ─── Экспорт полного проекта ─── */
  exportProject() {
    this._saveToArranged(this._editingIdx);
    const data = {
      version: 2,
      name: this._arrangedPatterns[this._editingIdx]?.name || 'Project',
      tempo: this.tempo,
      swing: this.swing,
      _arrangedPatterns: this._arrangedPatterns.map(ap => ({
        name: ap.name,
        locatorA: ap.locatorA,
        locatorB: ap.locatorB,
        _activeVariant: ap._activeVariant || 'a',
        _variantA: JSON.parse(JSON.stringify(ap._variantA)),
        _variantB: ap._variantB ? JSON.parse(JSON.stringify(ap._variantB)) : null,
      })),
      songSequence: [...this.songSequence],
      seqIndex: this.seqIndex,
      _editingIdx: this._editingIdx,
      songMode: this.songMode,
    };
    return data;
  }

  /* ─── Загрузка полного проекта ─── */
  loadProject(data) {
    if (!data._arrangedPatterns || !Array.isArray(data._arrangedPatterns)) return;
    if (data.tempo !== undefined) this.tempo = data.tempo;
    if (data.swing !== undefined) this.swing = data.swing;
    if (data.songSequence) this.songSequence = [...data.songSequence];
    if (data.seqIndex !== undefined) this.seqIndex = data.seqIndex;
    if (data.songMode !== undefined) this.songMode = data.songMode;

    this._arrangedPatterns = data._arrangedPatterns.map(ap => ({
      name: ap.name || '',
      locatorA: ap.locatorA ?? 0,
      locatorB: ap.locatorB ?? (ap._variantA?.patternLength || CONFIG.STEPS),
      _activeVariant: ap._activeVariant || 'a',
      _variantA: JSON.parse(JSON.stringify(ap._variantA)),
      _variantB: ap._variantB ? JSON.parse(JSON.stringify(ap._variantB)) : null,
      _undoStackA: [], _redoStackA: [],
      _undoStackB: [], _redoStackB: [],
    }));

    if (this._arrangedPatterns.length === 0) {
      const empty = StateManager._makeEmptyPattern();
      this._arrangedPatterns.push({
        _variantA: empty, _variantB: StateManager._makeEmptyPattern(),
        _activeVariant: 'a', name: '',
        locatorA: 0, locatorB: empty.patternLength,
        _undoStackA: [], _redoStackA: [], _undoStackB: [], _redoStackB: [],
      });
      this.songSequence = [0];
    }

    this._editingIdx = Math.min(data._editingIdx ?? 0, this._arrangedPatterns.length - 1);
    this._loadFromArranged(this._editingIdx);
    this.steps = this._getCurrentData().patternLength ?? CONFIG.STEPS;
    this.currentStep = -1;
    this._notify();
  }

  /* ─── Settings ─── */
  getSettings() {
    try { return JSON.parse(localStorage.getItem('chiptune_settings')) || { autosave: false }; }
    catch { return { autosave: false }; }
  }
  saveSettings(settings) {
    localStorage.setItem('chiptune_settings', JSON.stringify(settings));
  }

  sendToMidiOut() {
    // TODO: Web MIDI API
    console.log('sendToMidiOut: не реализовано');
  }
}

/* ═══════════════════════════════════════════════════════════
   DRUM SYNTH
   Синтез 8 инструментов TR-909 через Web Audio API
   ═══════════════════════════════════════════════════════════ */
class DrumSynth {
  constructor(ctx) {
    this.ctx = ctx;
    this.noiseBuffer = createNoiseBuffer(ctx, 0.5);
    this.samples = null; // AudioBuffer[] — инициализируется через initSamples()
  }

  /* Рендеринг всех 8 барабанов в AudioBuffer через OfflineAudioContext */
  async initSamples() {
    if (typeof OfflineAudioContext === 'undefined') return;
    const sampleRate = this.ctx.sampleRate;
    const duration = 0.8;
    this.samples = [];

    for (let i = 0; i < CONFIG.DRUM_INSTRUMENTS.length; i++) {
      try {
        const len = Math.ceil(sampleRate * duration);
        const offlineCtx = new OfflineAudioContext(1, len, sampleRate);
        const temp = new DrumSynth(offlineCtx);
        const fn = temp[`_drum_${CONFIG.DRUM_INSTRUMENTS[i].id}`];
        if (fn) fn.call(temp, 0.01);
        this.samples.push(await offlineCtx.startRendering());
      } catch (e) {
        this.samples = null;
        return; // fallback на синтез
      }
    }
  }

  /* Проигрывание сэмпла из буфера */
  playSample(instrumentIdx, time) {
    if (!this.samples || !this.samples[instrumentIdx]) {
      this.play(instrumentIdx, time); // fallback на синтез
      return;
    }
    const ctx = this.ctx;
    const src = ctx.createBufferSource();
    src.buffer = this.samples[instrumentIdx];
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(CONFIG.DRUM_GAIN, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + this.samples[instrumentIdx].duration);
    src.connect(gain);
    gain.connect(ctx.destination);
    src.start(time);
  }

  /* Синтез в реальном времени */
  play(instrumentIdx, time) {
    const fn = this[`_drum_${CONFIG.DRUM_INSTRUMENTS[instrumentIdx].id}`];
    if (fn) fn.call(this, time);
  }

  /* ── Bass Drum ── */
  _drum_kick(time) {
    const ctx = this.ctx;
    const { DRUM_GAIN } = CONFIG;

    // Основной тон с pitch sweep down (имитация 808/909 kick)
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(160, time);
    osc.frequency.exponentialRampToValueAtTime(30, time + 0.12);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(DRUM_GAIN * 1.2, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);

    // Щелчок атака (click) — короткий импульс на высокой частоте
    const clickOsc = ctx.createOscillator();
    clickOsc.type = 'square';
    clickOsc.frequency.setValueAtTime(800, time);
    clickOsc.frequency.exponentialRampToValueAtTime(100, time + 0.02);

    const clickGain = ctx.createGain();
    clickGain.gain.setValueAtTime(DRUM_GAIN * 0.4, time);
    clickGain.gain.exponentialRampToValueAtTime(0.001, time + 0.025);

    osc.connect(gain);
    gain.connect(ctx.destination);
    clickOsc.connect(clickGain);
    clickGain.connect(ctx.destination);

    osc.start(time);
    osc.stop(time + 0.45);
    clickOsc.start(time);
    clickOsc.stop(time + 0.03);
  }

  /* ── Snare Drum ── */
  _drum_snare(time) {
    const ctx = this.ctx;
    const { DRUM_GAIN } = CONFIG;

    // Тон (треугольник ~200Hz)
    const tone = ctx.createOscillator();
    tone.type = 'triangle';
    tone.frequency.setValueAtTime(200, time);
    tone.frequency.exponentialRampToValueAtTime(120, time + 0.05);

    const toneGain = ctx.createGain();
    toneGain.gain.setValueAtTime(DRUM_GAIN * 0.6, time);
    toneGain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);

    // Шум (snare wires)
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = this.noiseBuffer;

    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.setValueAtTime(3000, time);

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(DRUM_GAIN * 0.7, time);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, time + 0.18);

    tone.connect(toneGain);
    toneGain.connect(ctx.destination);
    noiseSrc.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(ctx.destination);

    tone.start(time);
    tone.stop(time + 0.15);
    noiseSrc.start(time);
    noiseSrc.stop(time + 0.2);
  }

  /* ── Clap ── */
  _drum_clap(time) {
    const ctx = this.ctx;
    const { DRUM_GAIN } = CONFIG;

    // Множественные всплески шума (имитация хлопка)
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = this.noiseBuffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(2500, time);
    filter.Q.setValueAtTime(3, time);

    const gain = ctx.createGain();
    // Серия коротких атак: 3 быстрых всплеска + длинный затухающий хвост
    const now = time;
    gain.gain.setValueAtTime(0, now);
    // Всплеск 1
    gain.gain.linearRampToValueAtTime(DRUM_GAIN * 0.8, now + 0.002);
    gain.gain.linearRampToValueAtTime(0.001, now + 0.01);
    // Всплеск 2
    gain.gain.linearRampToValueAtTime(DRUM_GAIN * 0.8, now + 0.015);
    gain.gain.linearRampToValueAtTime(0.001, now + 0.025);
    // Всплеск 3
    gain.gain.linearRampToValueAtTime(DRUM_GAIN * 0.8, now + 0.03);
    gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
    // Хвост
    gain.gain.linearRampToValueAtTime(DRUM_GAIN * 0.6, now + 0.045);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

    noiseSrc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    noiseSrc.start(time);
    noiseSrc.stop(time + 0.2);
  }

  /* ── Closed HiHat ── */
  _drum_clhat(time) {
    const ctx = this.ctx;
    const { DRUM_GAIN } = CONFIG;

    // Модулированный шум (6 осцилляторов в TR-909)
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = this.noiseBuffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(7000, time);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(DRUM_GAIN * 0.5, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.06);

    noiseSrc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    noiseSrc.start(time);
    noiseSrc.stop(time + 0.08);
  }

  /* ── Open HiHat ── */
  _drum_ophat(time) {
    const ctx = this.ctx;
    const { DRUM_GAIN } = CONFIG;

    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = this.noiseBuffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.setValueAtTime(6000, time);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(DRUM_GAIN * 0.5, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.3);

    noiseSrc.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    noiseSrc.start(time);
    noiseSrc.stop(time + 0.35);
  }

  /* ── Low Tom ── */
  _drum_lotom(time) {
    const ctx = this.ctx;
    const { DRUM_GAIN } = CONFIG;

    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(200, time);
    osc.frequency.exponentialRampToValueAtTime(80, time + 0.1);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(DRUM_GAIN * 0.8, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.25);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(time);
    osc.stop(time + 0.3);
  }

  /* ── High Tom ── */
  _drum_hitom(time) {
    const ctx = this.ctx;
    const { DRUM_GAIN } = CONFIG;

    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, time);
    osc.frequency.exponentialRampToValueAtTime(120, time + 0.08);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(DRUM_GAIN * 0.8, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start(time);
    osc.stop(time + 0.25);
  }

  /* ── Crash Cymbal ── */
  _drum_crash(time) {
    const ctx = this.ctx;
    const { DRUM_GAIN } = CONFIG;

    // Два слоя шума для реалистичности
    const noiseSrc1 = ctx.createBufferSource();
    noiseSrc1.buffer = this.noiseBuffer;

    const filter1 = ctx.createBiquadFilter();
    filter1.type = 'bandpass';
    filter1.frequency.setValueAtTime(5000, time);
    filter1.Q.setValueAtTime(1, time);

    const gain1 = ctx.createGain();
    gain1.gain.setValueAtTime(DRUM_GAIN * 0.4, time);
    gain1.gain.exponentialRampToValueAtTime(0.001, time + 0.6);

    const noiseSrc2 = ctx.createBufferSource();
    noiseSrc2.buffer = this.noiseBuffer;

    const filter2 = ctx.createBiquadFilter();
    filter2.type = 'highpass';
    filter2.frequency.setValueAtTime(8000, time);

    const gain2 = ctx.createGain();
    gain2.gain.setValueAtTime(DRUM_GAIN * 0.3, time);
    gain2.gain.exponentialRampToValueAtTime(0.001, time + 0.5);

    noiseSrc1.connect(filter1);
    filter1.connect(gain1);
    gain1.connect(ctx.destination);

    noiseSrc2.connect(filter2);
    filter2.connect(gain2);
    gain2.connect(ctx.destination);

    noiseSrc1.start(time);
    noiseSrc1.stop(time + 0.65);
    noiseSrc2.start(time);
    noiseSrc2.stop(time + 0.55);
  }
}

/* ═══════════════════════════════════════════════════════════
   AUDIO ENGINE
   ═══════════════════════════════════════════════════════════ */
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.drumSynth = null;
    this.activeNotes = new Map();
  }

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.drumSynth = new DrumSynth(this.ctx);
      this.drumSynth.initSamples(); // рендеринг сэмплов (асинхронно)
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    return this.ctx;
  }

  /* Сыграть мелодическую ноту с ADSR + Filter */
  scheduleNote(track, midi, time, duration, waveType, adsr, filter, adsrTarget, adsrDepth) {
    const ctx = this.ctx;
    if (!ctx) return;

    const freq = 440 * Math.pow(2, (midi - 69) / 12);

    const osc = ctx.createOscillator();
    osc.type = waveType;
    osc.frequency.setValueAtTime(freq, time);

    // Фильтр (BiquadFilter)
    const filterNode = ctx.createBiquadFilter();
    const routeAmp = adsrTarget && adsrTarget.amp;
    const routeFlt = adsrTarget && adsrTarget.filter;
    const depthAmp = adsrDepth ? adsrDepth.amp : 1;
    const depthFlt = adsrDepth ? adsrDepth.filter : 1;

    if (filter && filter.enabled && !routeFlt) {
      filterNode.type = filter.type;
      filterNode.frequency.setValueAtTime(filter.frequency, time);
      filterNode.Q.setValueAtTime(filter.q, time);
    } else if (routeFlt) {
      filterNode.type = filter ? filter.type : 'lowpass';
      filterNode.Q.setValueAtTime(filter ? filter.q : 1, time);
    } else {
      filterNode.type = 'allpass';
    }

    const { attack, decay, sustain, release } = adsr;
    const peak = CONFIG.OSC_GAIN;
    const maxAttackDecay = duration * 0.6;
    const adjAttack = Math.min(attack, maxAttackDecay * 0.5);
    const adjDecay = Math.min(decay, maxAttackDecay - adjAttack);
    const adjRelease = Math.min(release, duration * 0.5);
    const decayEnd = time + adjAttack + adjDecay;
    const sustainEnd = time + duration - adjRelease;

    const gainNode = ctx.createGain();

    if (routeAmp) {
      // ADSR управляет громкостью с глубиной depthAmp
      const centerAmp = peak;
      const modRange = peak * depthAmp; // насколько может меняться
      const minAmp = Math.max(0, centerAmp - modRange);
      const maxAmp = Math.min(1, centerAmp);
      gainNode.gain.setValueAtTime(minAmp, time);
      gainNode.gain.linearRampToValueAtTime(maxAmp, time + adjAttack);
      gainNode.gain.linearRampToValueAtTime(maxAmp - (maxAmp - minAmp) * (1 - sustain), decayEnd);
      if (sustainEnd > decayEnd) {
        gainNode.gain.setValueAtTime(maxAmp - (maxAmp - minAmp) * (1 - sustain), sustainEnd);
      }
      gainNode.gain.linearRampToValueAtTime(minAmp, time + duration);
    } else {
      gainNode.gain.setValueAtTime(peak, time);
    }

    if (routeFlt) {
      // ADSR управляет частотой среза с глубиной depthFlt
      const fMin = 20;
      const fMax = filter && filter.enabled ? filter.frequency : 8000;
      const fRange = (fMax - fMin) * depthFlt;
      const baseFreq = fMax - fRange; // нижняя точка модуляции

      filterNode.frequency.setValueAtTime(baseFreq, time);
      filterNode.frequency.linearRampToValueAtTime(fMax, time + adjAttack);
      filterNode.frequency.linearRampToValueAtTime(baseFreq + fRange * sustain, decayEnd);
      if (sustainEnd > decayEnd) {
        filterNode.frequency.setValueAtTime(baseFreq + fRange * sustain, sustainEnd);
      }
      filterNode.frequency.linearRampToValueAtTime(baseFreq, time + duration);
    }

    osc.connect(filterNode);
    filterNode.connect(gainNode);
    gainNode.connect(ctx.destination);

    osc.start(time);
    osc.stop(time + duration + 0.01);

    this.activeNotes.set(`${track}_${midi}_${time}`, {
      oscillator: osc,
      gainNode,
      track,
      startTime: time,
      endTime: time + duration,
    });
  }

  /* Сыграть барабан (синтез или сэмпл) */
  scheduleDrum(track, drumIdx, time, useSample) {
    if (!this.ctx || !this.drumSynth) return;
    if (useSample) {
      this.drumSynth.playSample(drumIdx, time);
    } else {
      this.drumSynth.play(drumIdx, time);
    }
  }

  stopAll() {
    const now = this.ctx ? this.ctx.currentTime : 0;
    for (const [key, note] of this.activeNotes) {
      try { note.oscillator.stop(now); } catch(e) {}
      note.gainNode.gain.cancelScheduledValues(now);
      note.gainNode.gain.setValueAtTime(0, now);
    }
    this.activeNotes.clear();
  }

  get currentTime() {
    return this.ctx ? this.ctx.currentTime : 0;
  }
}

/* ═══════════════════════════════════════════════════════════
   SEQUENCER
   ═══════════════════════════════════════════════════════════ */
class Sequencer {
  constructor(state, audio) {
    this.state = state;
    this.audio = audio;
    this.nextStepTime = 0;
    this.currentStep = 0;
    this.timerID = null;
    this._running = false;
    this._hasScheduled = false;
    this._didAdvance = false;
  }

  get isRunning() { return this._running; }

  get stepDuration() {
    return (60 / this.state.tempo) / 4;
  }

  start() {
    if (this._running) return;
    this.audio.init();

    this._running = true;
    this.state.isPlaying = true;
    this.nextStepTime = this.audio.currentTime + 0.05;
    const la = this.state.locatorA;
    const lb = this.state.locatorB;
    const cs = this.state.currentStep;
    this.currentStep = (cs >= la && cs < lb) ? cs : la;

    this.timerID = setInterval(() => this._schedulerTick(), CONFIG.SCHEDULE_INTERVAL);
  }

  stop() {
    this._running = false;
    this.state.isPlaying = false;
    this.state.currentStep = -1;
    this._hasScheduled = false;
    this._didAdvance = false;

    if (this.timerID) {
      clearInterval(this.timerID);
      this.timerID = null;
    }
    this.audio.stopAll();
  }

  _advancePattern() {
    const seq = this.state.songSequence;
    if (!seq || seq.length === 0) return;
    const nextIdx = (this.state.seqIndex + 1) % seq.length;
    this.state.seqIndex = nextIdx;
    this.state.switchSongPattern(seq[nextIdx]);
    this.currentStep = this.state.locatorA;
  }

  _schedulerTick() {
    const ctx = this.audio.ctx;
    if (!ctx) return;

    while (this.nextStepTime < ctx.currentTime + CONFIG.LOOKAHEAD) {
      // Авто-переключение на следующий паттерн, если шаг на границе локаторов
      if (this.state.songMode && this.currentStep === this.state.locatorA && this._hasScheduled && !this._didAdvance) {
        this._advancePattern();
        this._didAdvance = true;
      }

      // Swing
      let swingOffset = 0;
      if (this.currentStep % 2 === 1 && this.state.swing > 0) {
        swingOffset = (this.state.swing / 100) * this.stepDuration * 0.5;
      }

      const playTime = this.nextStepTime + swingOffset;
      const duration = this.stepDuration * 0.92;

      // Мелодические ноты
      const melodicNotes = this.state.getMelodicNotesAtStep(this.currentStep);
      for (const [track, midi] of melodicNotes) {
        if (this.state.trackMute[track]) continue;
        const wave = this.state.trackWaves[track];
        const adsr = this.state.trackAdsr[track];
        const filter = this.state.trackFilter[track];
        const adsrTarget = this.state.adsrTarget[track];
        const adsrDepth = this.state.adsrDepth[track];
        this.audio.scheduleNote(track, midi, playTime, duration, wave, adsr, filter, adsrTarget, adsrDepth);
      }

      // Барабаны (полифония: все активные инструменты на шаге)
      const drumNotes = this.state.getDrumNotesAtStep(this.currentStep);
      for (const [track, drumSet] of drumNotes) {
        if (this.state.trackMute[track]) continue;
        const useSample = this.state.drumSoundModes[track] === 'sample';
        for (const drumIdx of drumSet) {
          this.audio.scheduleDrum(track, drumIdx, playTime, useSample);
        }
      }

      // UI: запоминаем какой шаг сейчас играется, затем инкрементируем
      const playingStep = this.currentStep;
      const la = this.state.locatorA;
      const lb = this.state.locatorB;
      this.currentStep = this.currentStep + 1;
      if (la >= 0 && lb > la && this.currentStep >= lb) this.currentStep = la;
      this.state.currentStep = playingStep;
      this._hasScheduled = true;
      if (this.currentStep !== la) this._didAdvance = false;

      this.nextStepTime += this.stepDuration;
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   UI RENDERER
   ═══════════════════════════════════════════════════════════ */
class UIRenderer {
  constructor(state, sequencer) {
    this.state = state;
    this.sequencer = sequencer;
    this.melodicCells = [];   // melodicCells[track][step][midi] → DOM
    this.drumCells = [];      // drumCells[track][step][drumIdx] → DOM
    this.playheadEls = [];
    this._dragActive = false;

    // document mouseup — завершение drag-выделения
    document.addEventListener('mouseup', () => {
      if (this._dragActive) {
        this._dragActive = false;
        this.state.endSelect();
        this._updateSelection();
        this._updatePasteCursor();
      }
    });

    // document mousemove — автоскролл + выделение при drag
    document.addEventListener('mousemove', (e) => {
      if (!this._dragActive) return;
      const track = this.state.activeTrack;
      const isDrum = this.state.isDrumTrack(track);
      // Ищем скроллящийся контейнер через ячейку под курсором
      const cellUnder = document.elementFromPoint(e.clientX, e.clientY);
      if (!cellUnder) return;
      const scrollWrap = cellUnder.closest('.piano-roll-wrapper, .drum-grid-wrapper');
      if (!scrollWrap) return;
      const rect = scrollWrap.getBoundingClientRect();
      const edge = 30;
      if (e.clientX > rect.right - edge) { scrollWrap.scrollLeft += 10; }
      else if (e.clientX < rect.left + edge) { scrollWrap.scrollLeft -= 10; }
      // Определяем шаг под курсором
      const stepEl = cellUnder.closest('[data-step]');
      if (stepEl) {
        const targetStep = parseInt(stepEl.dataset.step);
        if (!isNaN(targetStep)) {
          this.state.extendSelect(targetStep);
          this._updateSelection();
        }
      }
    });
  }

  render() {
    const container = document.getElementById('tracksContainer');
    container.innerHTML = '';

    try {
      if (this.state.viewMode === 'arrange') {
        this._renderArrangeView(container);
      } else {
        this._renderEditView(container);
      }
    } catch (err) {
      console.error('UI Render error:', err);
      container.innerHTML = `<div style="color:red;padding:16px;font-family:monospace;">UI Render error: ${err.message}<br><pre>${err.stack}</pre></div>`;
    }
    if (typeof updateLoopBrowserTarget === 'function') updateLoopBrowserTarget();
  }

  _renderEditView(container) {
    // ─── Панель выбора паттерна ───
    const patBar = document.createElement('div');
    patBar.className = 'pattern-bar';
    const patLabel = document.createElement('button');
    patLabel.className = 'pattern-label variant-toggle';
    patLabel.textContent = this.state._activeVariant.toUpperCase();
    patLabel.title = 'Toggle A/B variation';
    patLabel.addEventListener('click', () => {
      this.state.toggleVariant();
      this.render();
    });
    patBar.appendChild(patLabel);

    // Контрол длины паттерна (в тактах)
    const barsLabel = document.createElement('span');
    barsLabel.className = 'pattern-label';
    barsLabel.textContent = 'Bars:';
    patBar.appendChild(barsLabel);
    const barValues = [1, 2, 4, 8, 16];
    const currentBars = this.state.steps / 16;
    barValues.forEach(bv => {
      const btn = document.createElement('button');
      btn.className = 'pattern-btn' + (currentBars === bv ? ' active' : '');
      btn.textContent = bv;
      btn.title = `${bv} bar${bv > 1 ? 's' : ''} (${bv * 16} steps)`;
      btn.addEventListener('click', () => {
        const steps = bv * 16;
        this.state.setPatternLength(steps);
        this.render();
      });
      patBar.appendChild(btn);
    });
    container.appendChild(patBar);

    // ─── Табы переключения дорожек ───
