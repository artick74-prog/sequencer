<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style Library — MIDI Reference Browser</title>
<style>
:root {
  --bg:#0c0e12; --panel:#141820; --panel2:#10141a; --border:#2a3344;
  --text:#d0d6e0; --dim:#7a8494; --accent:#3ddc97; --accent2:#1a6b4a;
  --danger:#e85d5d; --gold:#e8c170;
}
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
.header-brand{min-width:260px}
header h1{margin:0;font-size:16px;color:var(--accent);letter-spacing:.04em}
header .sub{color:var(--dim);font-size:12px;margin-top:2px}
.app-nav{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.app-nav a{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:6px 11px;border:1px solid var(--border);border-radius:4px;background:#0e1218;color:var(--text);text-decoration:none;font-size:12px}
.app-nav a:hover{border-color:var(--accent2);color:#fff}
.app-nav a.active{background:var(--accent2);border-color:var(--accent);color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border)}
button,.btn,select,input{background:#0e1218;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px 9px}
button{cursor:pointer} button:hover{border-color:var(--accent2);color:#fff} button.primary{background:var(--accent2);border-color:var(--accent)}
input[type="search"]{min-width:260px}
label{font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
.status{padding:8px 20px;font:12px ui-monospace,Consolas,monospace;color:var(--dim);border-bottom:1px solid var(--border)}
.status.ok{color:var(--accent)} .status.err{color:var(--danger)}
.layout{display:grid;grid-template-columns:340px 1fr;min-height:0;flex:1}
.sidebar{background:var(--panel2);border-right:1px solid var(--border);padding:14px;overflow:auto}
.sidebar h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:16px 0 8px}
.sidebar h2:first-child{margin-top:0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;font-size:12px;line-height:1.55}
.card strong{color:#fff}
.row{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;margin:6px 0}
.row select,.row input{width:100%}
.checkbox{display:flex;align-items:center;gap:6px;margin:6px 0}
.main{min-width:0;display:flex;flex-direction:column}
.list-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);background:#0f1319;font-size:12px;color:var(--dim)}
.list{overflow:auto;flex:1}
.item{display:grid;grid-template-columns:42px minmax(220px,1.5fr) 170px 120px 120px 80px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #1d2430;cursor:pointer}
.item:hover{background:#121923}.item.selected{background:#16241f;border-left:3px solid var(--accent);padding-left:9px}
.item .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.item .small{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item button{padding:4px 7px}
.pager{display:flex;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--border);background:var(--panel)}
.pager span{color:var(--dim);font-size:12px}
.badge{display:inline-block;padding:2px 6px;border:1px solid var(--border);border-radius:999px;color:var(--gold);font-size:11px}
.transport-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px;margin:8px 0 12px}
.transport-line{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:7px}
.transport-line strong{color:#fff}.transport-line span{color:var(--dim);font-family:ui-monospace,Consolas,monospace}
#progress{width:100%;padding:0;accent-color:var(--accent);cursor:pointer}
#progress:disabled{opacity:.35;cursor:default}
.empty{padding:40px;color:var(--dim);text-align:center}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{max-height:48vh;border-right:0;border-bottom:1px solid var(--border)}.item{grid-template-columns:42px 1fr 100px}.item .hide-small{display:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@logue/sf2synth@0.8.0/dist/sf2synth.iife.min.js"></script>
</head>
<body>
<header>
  <div class="header-brand">
    <h1>Style Library</h1>
    <div class="sub">MIDI references · GM / SoundFont preview · TD-3 / XR20 preview</div>
  </div>
  <nav class="app-nav" aria-label="Music workspace">
    <a href="index.html">Chiptune Sequencer</a>
    <a class="active" href="style-library.html">Style Library</a>
    <a href="midi-host.html">MIDI Host</a>
  </nav>
</header>

<div class="toolbar">
  <input id="search" type="search" placeholder="Поиск по имени, источнику, пути…">
  <select id="genre"><option value="">Все стили</option></select>
  <select id="kind"><option value="">Все типы</option></select>
  <select id="source"><option value="">Все источники</option></select>
  <button id="rescan">Rescan</button>
  <button id="repack">Rebuild packs</button>
  <span style="flex:1"></span>
  <span id="countLabel" style="color:var(--dim);font-size:12px">—</span>
</div>

<div id="status" class="status">Загрузка библиотеки…</div>

<div class="layout">
  <aside class="sidebar">
    <h2>Selected MIDI</h2>
    <div class="card" id="selectedCard">Ничего не выбрано.</div>
    <div class="transport-card">
      <div class="transport-line">
        <strong id="lengthLabel">Length —</strong>
        <span id="positionLabel">Bar — / —</span>
      </div>
      <input id="progress" type="range" min="0" max="1000" step="1" value="0" disabled>
    </div>

    <h2>Playback</h2>
    <div class="card">
      <div class="checkbox"><input id="gmOn" type="checkbox" checked><label for="gmOn">Browser GM / SoundFont</label></div>
      <div class="checkbox"><input id="hwOn" type="checkbox"><label for="hwOn">Hardware MIDI одновременно</label></div>
      <div class="checkbox"><input id="loopOn" type="checkbox" checked><label for="loopOn">Loop</label></div>

      <div class="row"><span>GM program</span><select id="program"></select></div>
      <div class="row"><span>BPM</span><input id="bpm" type="number" min="40" max="300" value="120"></div>
      <div class="row"><span>Transpose</span><input id="transpose" type="number" min="-36" max="36" value="0"></div>
      <div class="row"><span>HW channel</span>
        <select id="hwChannel">
          <option value="1">1 · XR20 Bass</option>
          <option value="2">2 · TD-3</option>
          <option value="10">10 · XR20 Drums</option>
          <option value="3">3</option><option value="4">4</option><option value="5">5</option>
          <option value="6">6</option><option value="7">7</option><option value="8">8</option>
          <option value="9">9</option><option value="11">11</option><option value="12">12</option>
          <option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option>
        </select>
      </div>
      <div class="row"><span>MIDI Out</span><select id="midiOut"><option value="">—</option></select></div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <button class="primary" id="play">Play</button>
        <button id="stop">Stop</button>
        <button id="openHost">Open in Host</button>
      </div>
    </div>

    <h2>Library</h2>
    <div class="card" id="libraryCard">—</div>
    <div id="sf2Placeholder" style="display:none"></div>
  </aside>

  <main class="main">
    <div class="list-head">
      <strong style="width:34px">▶</strong>
      <strong style="flex:1">MIDI</strong>
      <span>Source / type / style</span>
    </div>
    <div id="list" class="list"></div>
    <div class="pager">
      <button id="prev">←</button>
      <button id="next">→</button>
      <span id="pageLabel">—</span>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";

  const DEFAULT_SF2_URL = "https://cdn.jsdelivr.net/npm/@logue/sf2synth@0.8.0/dist/Yamaha%20XG%20Sound%20Set.sf2";
  const PAGE_SIZE = 100;
  const state = {
    catalog: [], filtered: [], page: 0, selected: null, midi: null,
    midiAccess: null, outputId: "", sf2Engine: null, sf2Ready: false,
    sf2Promise: null,
    timers: new Set(), schedulerTimer: null, progressFrame: null,
    playToken: 0, playing: false, gmPrograms: null,
    loadSeq: 0, loadController: null,
    events: [], eventIndex: 0,
    cycleTicks: 0, cycleStartTick: 0, cycleStartPerf: 0,
    transportStartTick: 0, transportStartPerf: 0,
    playbackBpm: 120, playbackPpq: 480,
    playConfig: null, seekTick: 0, resumeAfterSeek: false,
  };

  const $ = (id) => document.getElementById(id);
  function setStatus(text, cls="") {
    $("status").textContent = text;
    $("status").className = "status" + (cls ? " " + cls : "");
  }

  async function loadPrograms() {
    try {
      const r = await fetch("scripts/gm-instruments.json");
      const data = await r.json();
      state.gmPrograms = data.programs || [];
    } catch { state.gmPrograms = []; }
    $("program").innerHTML = "";
    for (let i=0;i<128;i++) {
      const o=document.createElement("option");
      o.value=String(i);
      o.textContent=i+" · "+(state.gmPrograms[i] || ("Program "+i));
      $("program").appendChild(o);
    }
    $("program").value="38";
  }

  async function initMidi() {
    if (!navigator.requestMIDIAccess) return;
    try {
      state.midiAccess = await navigator.requestMIDIAccess({sysex:false});
      state.midiAccess.onstatechange = refreshOutputs;
      refreshOutputs();
    } catch {}
  }

  function refreshOutputs() {
    const sel=$("midiOut"), prev=state.outputId;
    sel.innerHTML="";
    const outs=state.midiAccess ? [...state.midiAccess.outputs.values()] : [];
    if (!outs.length) {
      const o=document.createElement("option"); o.value=""; o.textContent="— no MIDI outputs —"; sel.appendChild(o); return;
    }
    for (const out of outs) {
      const o=document.createElement("option"); o.value=out.id; o.textContent=out.name; sel.appendChild(o);
    }
    const prefer=outs.find(o=>/td-?3|behringer|303/i.test(o.name)) || outs[0];
    const pick=outs.find(o=>o.id===prev) || prefer;
    state.outputId=pick.id; sel.value=pick.id;
  }

  function getOutput() {
    return state.midiAccess?.outputs.get(state.outputId) || null;
  }

  function readVLQ(bytes,i) {
    let v=0;
    while(i<bytes.length) {
      const b=bytes[i++]; v=(v<<7)|(b&0x7f);
      if(!(b&0x80)) break;
    }
    return [v,i];
  }

  function parseMidi(arrayBuffer) {
    const b=new Uint8Array(arrayBuffer);
    if (String.fromCharCode(...b.slice(0,4))!=="MThd") throw new Error("Not a Standard MIDI File");
    const u16=(i)=>(b[i]<<8)|b[i+1];
    const u32=(i)=>(b[i]*0x1000000)+(b[i+1]<<16)+(b[i+2]<<8)+b[i+3];
    const ppq=u16(12);
    if(ppq&0x8000) throw new Error("SMPTE division unsupported");
    const nTracks=u16(10);
    let off=8+u32(4), tempo=120, endTick=0, notes=[];

    for(let t=0;t<nTracks;t++) {
      if(String.fromCharCode(...b.slice(off,off+4))!=="MTrk") throw new Error("Missing MTrk");
      const end=off+8+u32(off+4);
      let i=off+8,tick=0,run=0;
      const open=new Map();
      while(i<end) {
        let d; [d,i]=readVLQ(b,i); tick+=d; endTick=Math.max(endTick,tick);
        let st=b[i];
        if(st<0x80) { if(!run) throw new Error("Bad running status"); st=run; }
        else { i++; run=st<0xf0?st:0; }
        if(st===0xff) {
          const type=b[i++]; let len; [len,i]=readVLQ(b,i);
          if(type===0x51 && len===3) {
            const us=(b[i]<<16)|(b[i+1]<<8)|b[i+2];
            if(us) tempo=60000000/us;
          }
          i+=len; continue;
        }
        if(st===0xf0 || st===0xf7) { let len; [len,i]=readVLQ(b,i); i+=len; continue; }
        const type=st&0xf0, ch=(st&0x0f)+1;
        if(type===0x80 || type===0x90) {
          const note=b[i++],vel=b[i++],key=(ch<<8)|note;
          if(type===0x90 && vel>0) {
            if(!open.has(key)) open.set(key,[]);
            open.get(key).push({tick,velocity:vel});
          } else {
            const q=open.get(key);
            if(q?.length) {
              const on=q.shift();
              notes.push({tick:on.tick,duration:Math.max(1,tick-on.tick),note,velocity:on.velocity,channel:ch});
            }
          }
        } else if(type===0xa0 || type===0xb0 || type===0xe0) i+=2;
        else if(type===0xc0 || type===0xd0) i+=1;
        else throw new Error("Unsupported MIDI status 0x"+st.toString(16));
      }
      off=end;
    }
    notes.sort((a,b)=>a.tick-b.tick || a.note-b.note);
    return {ppq,tempo,endTick,notes};
  }

  function isDrumSelection() {
    if (!state.selected || !state.midi) return false;
    if (state.selected.kind==="drums") return true;
    if (!state.midi.notes.length) return false;
    const ch10=state.midi.notes.filter(n=>n.channel===10).length;
    return ch10/state.midi.notes.length > 0.7;
  }

  async function ensureSf2() {
    if(state.sf2Ready && state.sf2Engine?.synth) return true;
    if(typeof SoundFont==="undefined") {
      setStatus("SF2 library не загрузилась.", "err");
      return false;
    }
    if(state.sf2Promise) return state.sf2Promise;

    state.sf2Promise=(async()=>{
      try {
        if(!state.sf2Engine) {
          state.sf2Engine=new SoundFont.WebMidiLink({
            drawSynth:false,
            placeholder:"sf2Placeholder",
            url:DEFAULT_SF2_URL,
            cache:true,
          });
          await new Promise((resolve,reject)=>{
            state.sf2Engine.setLoadCallback(resolve);
            state.sf2Engine.setup().catch(reject);
          });
        }
        await state.sf2Engine.synth.ctx.resume();
        state.sf2Ready=true;
        return true;
      } catch(e) {
        state.sf2Ready=false;
        setStatus("SF2: "+e.message,"err");
        return false;
      } finally {
        state.sf2Promise=null;
      }
    })();
    return state.sf2Promise;
  }

  function midiCycleTicks(midi=state.midi) {
    if(!midi) return 0;
    let maxEnd=Math.max(midi.endTick||0,midi.ppq||480);
    for(const n of midi.notes||[]) maxEnd=Math.max(maxEnd,n.tick+n.duration);
    return maxEnd;
  }

  function rawBars(midi=state.midi) {
    const ticks=midiCycleTicks(midi);
    return midi?.ppq ? ticks/(midi.ppq*4) : 0;
  }

  function displayBars(midi=state.midi) {
    const bars=rawBars(midi);
    if(!bars) return "—";
    const nearest=Math.round(bars);
    if(nearest>=1 && Math.abs(bars-nearest)<=0.12) return String(nearest);
    return bars.toFixed(2).replace(/\.00$/,"");
  }

  function formatClock(ms) {
    if(!Number.isFinite(ms) || ms<0) return "—";
    const total=Math.max(0,Math.round(ms/1000));
    const m=Math.floor(total/60);
    const sec=String(total%60).padStart(2,"0");
    return m+":"+sec;
  }

  function ticksToMs(ticks,bpm=state.playbackBpm,ppq=state.playbackPpq) {
    return (ticks/ppq)*(60000/bpm);
  }

  function msToTicks(ms,bpm=state.playbackBpm,ppq=state.playbackPpq) {
    return (ms/(60000/bpm))*ppq;
  }

  function currentPlaybackTick(now=performance.now()) {
    if(!state.playing) return Math.max(0,Math.min(state.seekTick,state.cycleTicks||0));
    const elapsed=Math.max(0,now-state.transportStartPerf);
    let tick=state.transportStartTick+msToTicks(elapsed);
    if($("loopOn").checked && state.cycleTicks>0) tick%=state.cycleTicks;
    return Math.max(0,Math.min(tick,state.cycleTicks||tick));
  }

  function updateProgressUI(tick=state.seekTick) {
    const p=$("progress");
    const midi=state.midi;
    if(!midi) {
      p.disabled=true; p.value="0";
      $("lengthLabel").textContent="Length —";
      $("positionLabel").textContent="Bar — / —";
      return;
    }

    const cycle=midiCycleTicks(midi);
    state.cycleTicks=cycle;
    const clamped=Math.max(0,Math.min(Number(tick)||0,cycle));
    const ratio=cycle>0 ? clamped/cycle : 0;
    p.disabled=false;
    p.value=String(Math.round(ratio*1000));

    const bars=displayBars(midi);
    const bpm=Number($("bpm").value)||midi.tempo||120;
    const duration=ticksToMs(cycle,bpm,midi.ppq);
    const barPos=midi.ppq ? clamped/(midi.ppq*4) : 0;
    const totalForPosition=Math.max(1,Math.ceil(rawBars(midi)));
    const currentBar=Math.min(totalForPosition,Math.floor(barPos)+1);
    $("lengthLabel").textContent="Length "+bars+" bars · "+formatClock(duration);
    $("positionLabel").textContent=
      "Bar "+currentBar+" / "+bars+
      " · "+formatClock(ticksToMs(clamped,bpm,midi.ppq))+" / "+formatClock(duration);
  }

  function clearScheduledAudio() {
    for(const t of state.timers) clearTimeout(t);
    state.timers.clear();
    if(state.schedulerTimer) {
      clearInterval(state.schedulerTimer);
      state.schedulerTimer=null;
    }
    if(state.progressFrame) {
      cancelAnimationFrame(state.progressFrame);
      state.progressFrame=null;
    }

    const synth=state.sf2Engine?.synth;
    if(synth) {
      try { for(let ch=0;ch<16;ch++) synth.allSoundOff(ch); } catch {}
    }
    const out=getOutput();
    if(out) {
      try {
        if(typeof out.clear==="function") out.clear();
        for(let ch=0;ch<16;ch++) out.send([0xb0|ch,123,0]);
      } catch {}
    }
  }

  function stop({reset=true,position=null}={}) {
    const pos=position!=null ? position : (state.playing ? currentPlaybackTick() : state.seekTick);
    state.playing=false;
    state.playToken++;
    clearScheduledAudio();
    state.seekTick=reset ? 0 : Math.max(0,Math.min(pos,state.cycleTicks||pos||0));
    $("play").textContent="Play";
    updateProgressUI(state.seekTick);
  }

  function scheduleTimeout(fn,delay,token) {
    const t=setTimeout(()=>{
      state.timers.delete(t);
      if(state.playToken===token && state.playing) fn();
    },Math.max(0,delay));
    state.timers.add(t);
  }

  function buildEvents(midi,transpose,drums) {
    const events=[];
    for(const n of midi.notes) {
      const note=Math.max(0,Math.min(127,n.note+(drums?0:transpose)));
      events.push({tick:n.tick,type:"on",note,velocity:n.velocity,order:1});
      events.push({tick:n.tick+n.duration,type:"off",note,velocity:0,order:0});
    }
    events.sort((a,b)=>a.tick-b.tick || a.order-b.order || a.note-b.note);
    return events;
  }

  function firstEventAtOrAfter(tick) {
    let lo=0,hi=state.events.length;
    while(lo<hi) {
      const mid=(lo+hi)>>1;
      if(state.events[mid].tick<tick) lo=mid+1;
      else hi=mid;
    }
    return lo;
  }

  function scheduleSf2Event(event,targetTime,token) {
    const synth=state.sf2Engine?.synth;
    if(!synth) return;
    const send=()=>{
      if(!state.playing || state.playToken!==token) return;
      const ch=state.playConfig.gmCh;
      if(event.type==="on") synth.noteOn(ch,event.note,event.velocity);
      else synth.noteOff(ch,event.note);
    };
    const delay=targetTime-performance.now();
    if(delay<=2) send();
    else scheduleTimeout(send,delay,token);
  }

  function scheduleHardwareEvent(event,targetTime) {
    const out=state.playConfig.out;
    if(!out) return;
    const ch=state.playConfig.hwCh;
    try {
      out.send(
        event.type==="on"
          ? [0x90|ch,event.note,event.velocity]
          : [0x80|ch,event.note,0],
        targetTime
      );
    } catch(e) {
      setStatus("Hardware MIDI: "+e.message,"err");
    }
  }

  function schedulerPump(token) {
    if(!state.playing || state.playToken!==token) return;
    const now=performance.now();
    const deadline=now+120;

    while(state.playing && state.playToken===token) {
      if(state.eventIndex<state.events.length) {
        const ev=state.events[state.eventIndex];
        if(ev.tick<state.cycleStartTick) {
          state.eventIndex++;
          continue;
        }
        const target=state.cycleStartPerf+
          ticksToMs(ev.tick-state.cycleStartTick,state.playbackBpm,state.playbackPpq);
        if(target>deadline) break;
        state.eventIndex++;
        if(state.playConfig.gmOn) scheduleSf2Event(ev,target,token);
        if(state.playConfig.hwOn) scheduleHardwareEvent(ev,target);
        continue;
      }

      const cycleEnd=state.cycleStartPerf+
        ticksToMs(state.cycleTicks-state.cycleStartTick,state.playbackBpm,state.playbackPpq);

      if($("loopOn").checked) {
        if(cycleEnd>deadline) break;
        state.cycleStartPerf=cycleEnd;
        state.cycleStartTick=0;
        state.eventIndex=0;
        continue;
      }

      if(now>=cycleEnd+30) {
        state.seekTick=state.cycleTicks;
        stop({reset:false,position:state.cycleTicks});
      }
      break;
    }
  }

  function progressFrame(token) {
    if(!state.playing || state.playToken!==token) return;
    const tick=currentPlaybackTick();
    state.seekTick=tick;
    updateProgressUI(tick);
    state.progressFrame=requestAnimationFrame(()=>progressFrame(token));
  }

  async function play() {
    if(!state.selected) {
      setStatus("Сначала выбери MIDI.","err");
      return;
    }
    if(!state.midi && !(await loadEntry(state.selected,false))) return;

    // Cancel the previous transport before any async SoundFont work.
    stop({reset:false});
    const token=state.playToken;
    const selectedId=state.selected.id;
    const midi=state.midi;

    const gmOn=$("gmOn").checked;
    const hwOn=$("hwOn").checked;
    if(!gmOn && !hwOn) {
      setStatus("Включи GM и/или Hardware MIDI.","err");
      return;
    }
    if(gmOn && !(await ensureSf2())) return;

    // A newer selection/play request won while SF2 was loading.
    if(token!==state.playToken || state.selected?.id!==selectedId || state.midi!==midi) return;

    const out=hwOn ? getOutput() : null;
    if(hwOn && !out) {
      setStatus("Hardware MIDI включён, но MIDI Out не выбран.","err");
      return;
    }

    const bpm=Number($("bpm").value)||midi.tempo||120;
    const transpose=Number($("transpose").value)||0;
    const hwCh=(Number($("hwChannel").value)||1)-1;
    const drums=isDrumSelection();
    const gmCh=drums?9:0;
    const synth=state.sf2Engine?.synth;
    const program=Number($("program").value)||0;

    if(gmOn && synth) {
      synth.setPercussionPart(gmCh,drums);
      if(!drums) synth.programChange(gmCh,program);
    }

    state.playbackBpm=bpm;
    state.playbackPpq=midi.ppq;
    state.cycleTicks=midiCycleTicks(midi);
    if(state.seekTick>=state.cycleTicks) state.seekTick=0;
    state.events=buildEvents(midi,transpose,drums);
    state.cycleStartTick=state.seekTick;
    state.transportStartTick=state.seekTick;
    state.cycleStartPerf=performance.now()+35;
    state.transportStartPerf=state.cycleStartPerf;
    state.eventIndex=firstEventAtOrAfter(state.cycleStartTick);
    state.playConfig={gmOn,hwOn,out,hwCh,gmCh};
    state.playing=true;
    $("play").textContent="Playing…";

    schedulerPump(token);
    state.schedulerTimer=setInterval(()=>schedulerPump(token),20);
    state.progressFrame=requestAnimationFrame(()=>progressFrame(token));

    setStatus(
      "Play · "+state.selected.name+" · "+Math.round(bpm)+" BPM · "+
      displayBars(midi)+" bars"+(drums?" · drums":""),
      "ok"
    );
  }

  async function loadEntry(entry, autoplay=false) {
    const seq=++state.loadSeq;
    if(state.loadController) state.loadController.abort();
    const controller=new AbortController();
    state.loadController=controller;

    stop({reset:true});
    state.selected=entry;
    state.midi=null;
    renderSelected();
    renderList();
    setStatus("Loading "+entry.name+"…");

    try {
      const r=await fetch(
        "/api/library/midi?id="+encodeURIComponent(entry.id),
        {signal:controller.signal}
      );
      if(!r.ok) throw new Error(await r.text());
      const midi=parseMidi(await r.arrayBuffer());

      if(seq!==state.loadSeq || controller.signal.aborted) return false;
      state.midi=midi;
      state.seekTick=0;
      state.cycleTicks=midiCycleTicks(midi);
      $("bpm").value=String(Math.round(midi.tempo||120));

      renderSelected();
      updateProgressUI(0);
      renderList();

      if(autoplay && seq===state.loadSeq && state.selected?.id===entry.id) {
        await play();
      } else {
        setStatus(
          "Loaded "+entry.name+" · "+displayBars(midi)+" bars · "+
          midi.notes.length+" notes",
          "ok"
        );
      }
      return true;
    } catch(e) {
      if(e.name==="AbortError") return false;
      if(seq!==state.loadSeq) return false;
      state.midi=null;
      state.seekTick=0;
      setStatus("MIDI load error: "+e.message,"err");
      renderSelected();
      updateProgressUI(0);
      return false;
    } finally {
      if(seq===state.loadSeq) state.loadController=null;
    }
  }

  function renderSelected() {
    const e=state.selected,m=state.midi;
    if(!e) { $("selectedCard").textContent="Ничего не выбрано."; return; }
    const bits=[
      "<strong>"+escapeHtml(e.name)+"</strong>",
      "<span class='badge'>"+escapeHtml(e.kind)+"</span> <span class='badge'>"+escapeHtml(e.genre)+"</span>",
      "<div>"+escapeHtml(e.source)+"</div>",
      "<div style='color:var(--dim);word-break:break-all'>"+escapeHtml(e.member||e.container)+"</div>",
    ];
    if(Array.isArray(e.classificationRoles) && e.classificationRoles.length) {
      bits.push("<div>Roles: <strong>"+escapeHtml(e.classificationRoles.join(", "))+"</strong></div>");
    }
    if(Array.isArray(e.classificationPrograms) && e.classificationPrograms.length) {
      const names=e.classificationPrograms.map(p=>
        p+" "+(state.gmPrograms?.[p] || ("Program "+p))
      );
      bits.push("<div>GM instruments: "+escapeHtml(names.join(", "))+"</div>");
    } else if(e.classificationMethod?.includes("program")) {
      bits.push("<div style='color:var(--dim)'>GM instruments: not encoded in MIDI</div>");
    }
    if(e.classificationReason) {
      const confidence=Math.round((Number(e.classificationConfidence)||0)*100);
      bits.push(
        "<div style='color:var(--dim)'>Classified "+confidence+"% · "+
        escapeHtml(e.classificationReason)+"</div>"
      );
    }
    if(m) {
      const bars=displayBars(m);
      const cycle=midiCycleTicks(m);
      const duration=ticksToMs(cycle,Number($("bpm").value)||m.tempo||120,m.ppq);
      bits.push(
        "<div><strong>"+bars+" bars</strong> · "+m.notes.length+" notes · "+
        Math.round(m.tempo)+" BPM · PPQ "+m.ppq+" · "+formatClock(duration)+"</div>"
      );
    }
    $("selectedCard").innerHTML=bits.join("");
  }

  function escapeHtml(s) {
    return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }

  function fillSelect(id,values,label) {
    const el=$(id),keep=el.value;
    el.innerHTML="<option value=''>"+label+"</option>";
    for(const v of values.sort((a,b)=>a.localeCompare(b))) {
      const o=document.createElement("option"); o.value=v; o.textContent=v; el.appendChild(o);
    }
    if(values.includes(keep)) el.value=keep;
  }

  function applyFilters() {
    const q=$("search").value.trim().toLowerCase();
    const genre=$("genre").value,kind=$("kind").value,source=$("source").value;
    state.filtered=state.catalog.filter(e=>{
      if(genre&&e.genre!==genre) return false;
      if(kind&&e.kind!==kind) return false;
      if(source&&e.source!==source) return false;
      if(q) {
        const hay=(e.name+" "+e.source+" "+(e.member||"")+" "+e.genre+" "+e.kind).toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    state.page=0; renderList();
  }

  function renderList() {
    const total=state.filtered.length;
    const pages=Math.max(1,Math.ceil(total/PAGE_SIZE));
    state.page=Math.max(0,Math.min(state.page,pages-1));
    const start=state.page*PAGE_SIZE;
    const rows=state.filtered.slice(start,start+PAGE_SIZE);
    const list=$("list");
    list.innerHTML="";
    if(!rows.length) {
      list.innerHTML="<div class='empty'>Ничего не найдено.</div>";
    } else {
      for(const e of rows) {
        const row=document.createElement("div");
        row.className="item"+(state.selected?.id===e.id?" selected":"");
        row.innerHTML=
          "<button title='Play'>▶</button>"+
          "<div><div class='name'>"+escapeHtml(e.name)+"</div><div class='small'>"+escapeHtml(e.member||e.container)+"</div></div>"+
          "<div class='small'>"+escapeHtml(e.source)+"</div>"+
          "<div class='small hide-small'>"+escapeHtml(e.kind)+"</div>"+
          "<div class='small hide-small'>"+escapeHtml(e.genre)+"</div>"+
          "<div class='small hide-small'>"+Math.round((e.size||0)/1024)+" KB</div>";
        row.addEventListener("click",()=>loadEntry(e,false));
        row.querySelector("button").addEventListener("click",(ev)=>{ev.stopPropagation();loadEntry(e,true);});
        list.appendChild(row);
      }
    }
    $("pageLabel").textContent=(total?start+1:0)+"–"+Math.min(total,start+PAGE_SIZE)+" / "+total+" · page "+(state.page+1)+"/"+pages;
    $("countLabel").textContent=total+" MIDI";
    $("prev").disabled=state.page<=0;
    $("next").disabled=state.page>=pages-1;
  }

  async function loadCatalog(force=false) {
    state.loadSeq++;
    if(state.loadController) {
      state.loadController.abort();
      state.loadController=null;
    }
    stop({reset:true});
    setStatus(force?"Пересканирование библиотеки…":"Индексирование библиотеки…");
    try {
      const r=await fetch("/api/library"+(force?"/rescan":""),
        force?{method:"POST"}:undefined);
      const data=await r.json();
      if(!r.ok) throw new Error(data.error||"Library API error");
      state.catalog=data.entries||[];
      state.filtered=state.catalog.slice();
      fillSelect("genre",[...new Set(state.catalog.map(e=>e.genre))],"Все стили");
      fillSelect("kind",[...new Set(state.catalog.map(e=>e.kind))],"Все типы");
      fillSelect("source",[...new Set(state.catalog.map(e=>e.source))],"Все источники");
      const c=data.counts||{};
      $("libraryCard").innerHTML=
        "<strong>"+(c.total||0).toLocaleString("ru-RU")+" MIDI</strong><br>"+
        "Mode: <strong>"+escapeHtml(data.mode||"raw")+"</strong>"+
        (data.mode==="packs"?" · "+Number(data.packCount||0).toLocaleString("ru-RU")+" ZIP packs":"")+"<br>"+
        "Root: <span style='word-break:break-all'>"+escapeHtml(data.root||"")+"</span><br>"+
        "Sources: "+Object.keys(c.source||{}).length;
      applyFilters();
      setStatus(
        "Library ready · "+state.catalog.length.toLocaleString("ru-RU")+" MIDI"+
        (data.mode==="packs"?" · "+Number(data.packCount||0).toLocaleString("ru-RU")+" packs":""),
        "ok"
      );
    } catch(e) {
      setStatus("Library error: "+e.message+". Запусти start-midi-host.bat после git pull.","err");
      $("list").innerHTML="<div class='empty'>Нет связи с локальной Style Library API.</div>";
    }
  }

  $("search").addEventListener("input",applyFilters);
  $("genre").addEventListener("change",applyFilters);
  $("kind").addEventListener("change",applyFilters);
  $("source").addEventListener("change",applyFilters);
  $("rescan").addEventListener("click",()=>loadCatalog(true));
  $("repack").addEventListener("click",async()=>{
    stop({reset:true});
    $("repack").disabled=true;
    $("rescan").disabled=true;
    setStatus("Rebuild packs: классифицируем библиотеку и собираем небольшие ZIP-паки…");
    try {
      const r=await fetch("/api/library/repack",{method:"POST"});
      const data=await r.json();
      if(!r.ok) throw new Error(data.error||"Pack rebuild error");
      await loadCatalog(false);
      setStatus(
        "Packs ready · "+Number(data.packs||0).toLocaleString("ru-RU")+
        " ZIP · "+Number(data.total||0).toLocaleString("ru-RU")+" MIDI",
        "ok"
      );
    } catch(e) {
      setStatus("Pack rebuild error: "+e.message,"err");
    } finally {
      $("repack").disabled=false;
      $("rescan").disabled=false;
    }
  });
  $("prev").addEventListener("click",()=>{state.page--;renderList();});
  $("next").addEventListener("click",()=>{state.page++;renderList();});
  $("play").addEventListener("click",play);
  $("stop").addEventListener("click",()=>stop({reset:true}));
  $("midiOut").addEventListener("change",()=>{
    const wasPlaying=state.playing;
    const tick=wasPlaying ? currentPlaybackTick() : state.seekTick;
    stop({reset:false,position:tick});
    state.outputId=$("midiOut").value;
    if(wasPlaying) play();
  });

  const savedHwChannel=localStorage.getItem("styleLibraryHwChannel");
  if(savedHwChannel && [...$("hwChannel").options].some(o=>o.value===savedHwChannel)) {
    $("hwChannel").value=savedHwChannel;
  }
  $("hwChannel").addEventListener("change",()=>{
    localStorage.setItem("styleLibraryHwChannel",$("hwChannel").value);
  });


  $("bpm").addEventListener("change",()=>{
    renderSelected();
    updateProgressUI(state.seekTick);
    if(state.playing) {
      const tick=currentPlaybackTick();
      stop({reset:false,position:tick});
      play();
    }
  });

  $("progress").addEventListener("pointerdown",()=>{
    state.resumeAfterSeek=state.playing;
    if(state.playing) {
      const tick=currentPlaybackTick();
      stop({reset:false,position:tick});
    }
  });
  $("progress").addEventListener("input",()=>{
    if(!state.midi) return;
    state.seekTick=(Number($("progress").value)/1000)*midiCycleTicks(state.midi);
    updateProgressUI(state.seekTick);
  });
  $("progress").addEventListener("change",()=>{
    if(state.resumeAfterSeek) {
      state.resumeAfterSeek=false;
      play();
    }
  });
  $("openHost").addEventListener("click",()=>{
    if(!state.selected) { setStatus("Сначала выбери MIDI.","err"); return; }
    location.href="midi-host.html?library="+encodeURIComponent(state.selected.id)+"&name="+encodeURIComponent(state.selected.name);
  });

  updateProgressUI(0);
  loadPrograms();
  initMidi();
  loadCatalog(false);
})();
</script>
</body>
</html>
